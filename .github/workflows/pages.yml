name: pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR builds are cancelled; master builds queue rather than cancel.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # index.json is regenerated on master after a merge, so a push can land
      # before it is. The site then still publishes the committed index, which
      # stays consistent -- models added since are just not in it yet -- and
      # this says so rather than failing the deploy. Not on pull requests,
      # where index.json is stale by rule.
      - name: Check index.json is current
        if: github.event_name != 'pull_request'
        run: |
          npm run -s build:index >/dev/null
          if ! git diff --quiet -- index.json; then
            echo "::warning title=index.json is stale::models/ has changed since index.json was generated, so the published catalog does not include it yet. Run npm run build:index on master and commit index.json."
          fi
          git checkout -- index.json

      - name: Build Pages site and catalog
        run: npm run build:site

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and never cancel one mid-flight.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
