name: lints

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install schema checker
        run: npm ci

      - name: Validate model schemas
        run: npm run validate:schema

      - name: Test the catalog library
        run: npm run test:lib

  validate-helm:
    name: validate-helm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Compare the PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install validator dependencies
        run: npm ci

      - name: Test Helm validator
        run: npm run test:helm

      - name: Install pinned Helm and kubeconform
        run: npm run helm:install

      - name: Validate changed model variants against latest stable charts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run validate:helm -- --base "$BASE_REF" --chart-mode latest

      - name: Save Helm validation logs and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-validation
          path: artifacts/helm-validation/
          if-no-files-found: ignore
          retention-days: 14
