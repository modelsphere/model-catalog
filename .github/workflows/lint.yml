name: lints

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install schema checker
        run: npm ci

      - name: Validate model schemas
        run: npm run validate:schema

      - name: Test the catalog library
        run: npm run test:lib
