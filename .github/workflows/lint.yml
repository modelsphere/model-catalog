name: lints

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate model schemas
        run: npm run validate:schema

      - name: Test the catalog library
        run: npm run test:lib

      - name: Test Helm validator
        run: npm run test:helm

      - name: Install pinned Helm and kubeconform
        run: npm run helm:install

      - name: Validate every model variant against latest stable charts
        run: npm run validate:helm

      # A catalog is public, so every image must be pullable by anyone. The
      # runner is the outside world: no login, no VPN.
      - name: Check every image is publicly pullable
        run: npm run validate:images
