# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v1
name: laguna-s-2.1
version: 1.0.0
servedName: Laguna-S-2.1
variants:
  - id: sglang-tp4-h100-baseline
    description: 'Baseline: TP4 on four H100 GPUs, single node.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.8.0"
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: dev-dsv41
    requires:
      gpus: 4
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --cuda-graph-max-bs-decode=64
        - --enable-cache-report
        - --mem-fraction-static=0.78
        - --reasoning-parser=poolside_v1
        - --stream-response-default-include-usage
        - --tool-call-parser=poolside_v1
        - --tp-size=4
        - --trust-remote-code
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
  - id: sglang-tp8-h100-optimized
    default: true
    description: 'Tuned by LLM AutoTune: TP8 on eight H100 GPUs, single node, fp8 KV cache. +26% on the tuning benchmark vs the baseline variant.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.8.0"
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: dev-dsv41
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --chunked-prefill-size=16384
        - --cuda-graph-max-bs-decode=64
        - --cuda-graph-max-bs-prefill=4096
        - --enable-cache-report
        - --kv-cache-dtype=fp8_e4m3
        - --max-prefill-tokens=16384
        - --mem-fraction-static=0.8
        - --reasoning-parser=poolside_v1
        - --stream-response-default-include-usage
        - --tool-call-parser=poolside_v1
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
