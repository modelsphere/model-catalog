# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v2
kind: Variant
model: laguna-s-2.1
id: sglang-tp4-h100-baseline
version: 1.0.0
releaseDate: 2026-10-12
servedName: Laguna-S-2.1
description: 'Baseline: TP4 on four H100 GPUs, single node.'
engine: sglang
chart:
  name: sglang
  version: ">=0.7.1"
image:
  repository: lmsysorg/sglang
  tag: dev-dsv41
requires:
  gpus: 4
  topology: single-node
  gpuProduct:
    - NVIDIA-H100-80GB-HBM3
values:
  model:
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - '*.safetensors'
  extraArgs:
    - --cuda-graph-max-bs-decode=64
    - --enable-cache-report
    - --mem-fraction-static=0.78
    - --reasoning-parser=poolside_v1
    - --stream-response-default-include-usage
    - --tool-call-parser=poolside_v1
    - --tp-size=4
    - --trust-remote-code
  env:
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: NVIDIA_DISABLE_REQUIRE
      value: '1'
  volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
  volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
