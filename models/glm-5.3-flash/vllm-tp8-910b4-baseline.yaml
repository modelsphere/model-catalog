# GLM-5.3-Flash (W8A8) on one Atlas 800T A2 node with eight Ascend 910B4 cards.
#
# The vLLM-Ascend A2 colocated recipe uses DP2/TP8 across two nodes. This baseline
# uses DP1/TP8 on one node, enables the glm47 API parsers, and uses the checkpoint's
# full context. Set pod labels, node selectors, tolerations, and scheduler via
# deployment overrides for the target cluster.
#
# Historical throughput measurements used Model Runner V2 on the pinned image.
# V2 later failed the AutoTune output check on that image. These figures describe
# the earlier runs. Throughput with the current V1 baseline has not been established.
#
# Single-node runs used a 600-second window, with 50K input and 1,500 output tokens
# per request sent directly to the engine.
#
# At 1,048,576 context, 0.9 GPU memory utilization, and 8,192 batched tokens,
# concurrency 16 reached 2,789.7 total tok/s with 73.1s time to first token (TTFT).
# The engine reported 1,103,697 KV-cache tokens, enough for one full-length request.
#
# At the cookbook's 133,120 context and 0.85 GPU memory utilization, with
# 8,192 batched tokens and 802,285 KV-cache tokens, the concurrency sweep was:
#   Concurrency 12   2,608.6 total tok/s   29.6s TTFT
#   Concurrency 16   2,794.6 total tok/s   63.2s TTFT
#   Concurrency 20   2,707.3 total tok/s  101.1s TTFT
# At concurrency 16, the full-context run had similar throughput and 16% higher TTFT.
#
# With 16,384 batched tokens at 133,120 context and 0.85 GPU memory utilization,
# concurrency 16 reached 3,003.7 total tok/s (+7.5%) with 85.6s TTFT and 691,154
# KV-cache tokens. With the full context and 0.9 utilization, that batch size
# failed at startup. The engine reported 12.88 GiB required and 12.1 GiB available.
#
# In earlier topology comparisons, single-node DP4/TP2 reduced throughput by 36.5%
# and raised TTFT from 63s to 153s. Two-node DP2/TP8 measured 2,641.4 total tok/s at
# concurrency 32, about 47% of the single-node throughput per card.
apiVersion: catalog.swiss/v2
kind: Variant
model: glm-5.3-flash
id: vllm-tp8-910b4-baseline
version: 1.0.5
servedName: GLM-5.3-Flash
description: >-
  Serves Eco-Tech/GLM-5.3-Flash-w8a8 with TP8/DP1 on one eight-card Ascend 910B4 node.
  Uses Model Runner V1 with vLLM-Ascend 0.30.0rc2 and supports the checkpoint's full
  1,048,576-token context.
engine: vllm
chart:
  name: vllm
  # 0.9.1 renders requires.gpus under the site's resource (model.gpuResource).
  version: ">=0.9.1"
image:
  # The chart renders repository:tag. The digest in the tag pins vLLM 0.30.0
  # with vLLM-Ascend 0.30.0rc2, which registers the Ascend Glm5NextForCausalLM.
  # Use an Atlas A2 image for this variant. A5 images target 950DT.
  repository: quay.io/ascend/vllm-ascend
  tag: "pinned@sha256:7859b75177884252d2b703eff727831ccab4e33a8bde0a9b4ac7563facc98b33"
requires:
  gpus: 8
  topology: single-node
  vendor: ascend
  gpuProduct:
    - Ascend-910B4
values:
  # Keep the engine API on the pod network. The engine has no authentication of its own.
  hostNetwork: false
  securityContext:
    privileged: true
  model:
    # Pre-stage the weights here, or override the path in the site profile.
    localPath: /data/share/models/GLM-5.3-Flash-w8a8
    mountPath: /model
    hostPathType: Directory
    # Matches --max-model-len and the checkpoint's max_position_embeddings.
    contextLength: "1048576"
  modelCheck:
    requiredGlobs:
      - config.json
      - "*.safetensors"
  resources:
    # The engine used about 27 GB of host memory while serving. The 64Gi request
    # leaves headroom and lets the scheduler place the pod on smaller nodes.
    # Weight loading also uses reclaimable page cache. Peak loading memory is unmeasured.
    requests:
      cpu: "32"
      memory: 64Gi
      ephemeral-storage: 16Gi
    limits:
      cpu: "32"
      memory: 768Gi
      ephemeral-storage: 16Gi
  shm:
    enabled: true
    sizeLimit: 1Gi
  extraArgs:
    - --trust-remote-code
    - --quantization=ascend
    # GLM-5.3-Flash uses the glm47 tool-call and reasoning parsers. Automatic tool
    # choice requires a tool-call parser.
    - --tool-call-parser=glm47
    - --reasoning-parser=glm47
    - --enable-auto-tool-choice
    - --data-parallel-size=1
    - --tensor-parallel-size=8
    - --enable-expert-parallel
    - --max-num-seqs=32
    - --seed=1024
    - --max-model-len=1048576
    - --max-num-batched-tokens=8192
    # The full context requires more KV cache than was available at 0.85 utilization.
    - --gpu-memory-utilization=0.9
    - --limit-mm-per-prompt={"image":1,"video":0}
    - --compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,16,32,64,96,128]}
    - --speculative-config={"method":"deepseek_mtp","num_speculative_tokens":3,"enforce_eager":true}
    # The startup timeout below allows for the roughly 18-minute weight load
    # observed with this loader configuration.
    - --model-loader-extra-config={"enable_multithread_load":true,"num_threads":128}
    - --safetensors-load-strategy=lazy
  env:
    # Use Model Runner V1 with the pinned vLLM-Ascend 0.30.0rc2 image. V2 answered
    # only 1 of 10 elementary math questions correctly, failing the AutoTune health
    # check with garbage_output. Switching to V1 resolved the failure.
    # Use Model Runner V2 (value "1") with the Atlas A2 v0.32.0rc image.
    - name: VLLM_USE_V2_MODEL_RUNNER
      value: "0"
    - name: PYTORCH_NPU_ALLOC_CONF
      value: expandable_segments:True
    - name: HCCL_BUFFSIZE
      value: "1024"
    - name: HCCL_OP_EXPANSION_MODE
      value: AIV
    - name: VLLM_RPC_TIMEOUT
      value: "3600000"
    - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
      value: "3000"
    - name: HCCL_EXEC_TIMEOUT
      value: "3600"
    - name: HCCL_CONNECT_TIMEOUT
      value: "1200"
    # Allow up to one hour for the engine to become ready.
    - name: VLLM_ENGINE_READY_TIMEOUT_S
      value: "3600"
    - name: ASCEND_RT_VISIBLE_DEVICES
      value: "0,1,2,3,4,5,6,7"
    - name: ASCEND_GLOBAL_LOG_LEVEL
      value: "1"
    - name: ASCEND_PROCESS_LOG_PATH
      value: /root/ascend/log
  volumes:
    - name: cann-diagnostics
      hostPath:
        path: /data/share/deployments/glm-5.3-flash-910b4-cann
        type: DirectoryOrCreate
  volumeMounts:
    - name: cann-diagnostics
      mountPath: /root/ascend/log
  # The startup probe allows about 90 minutes for weight loading and graph capture.
  startupProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  readinessProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 10
    failureThreshold: 3
  progressDeadlineSeconds: 7200
