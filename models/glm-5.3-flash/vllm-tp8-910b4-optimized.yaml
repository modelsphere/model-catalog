# GLM-5.3-Flash (w8a8) on ONE Ascend 910B4 node (Atlas 800T A2), 8 cards, vLLM-Ascend.
#
# The baseline variant beside this one is the vendor's recipe. This is that recipe with FOUR
# configuration changes and a newer runtime, each of which was measured on its own, on one node,
# against that node's own control.
#
# ===================== HOW TO READ THE NUMBERS =====================
# INPUT tok/s is the metric, not TOTAL. Every prompt in this workload is exactly 50,000 tokens, so
# INPUT = completed requests x 50,000 / window: it cannot be moved by the model deciding to
# generate more or fewer output tokens. TOTAL can, and did -- two configurations here differed by
# 0.1% on TOTAL while one of them generated 5% more output per request; on INPUT they were
# identical. One request is 66.7 INPUT tok/s, and that quantum is the resolution of every figure
# below.
#
# The window is 750s at concurrency 16, 50K input / 1500 output, engine-direct, same weights,
# image and client throughout. Run-to-run drift on this hardware is about +-2 request quanta
# (+-2.5%), measured by repeating configurations rather than assumed. A FIRST window reads about
# 4% low because the first 16 requests prefill together (TTFT mean 47.5s against 9.5s afterwards),
# so first windows are only compared with first windows.
#
# These windows are 750s. The baseline variant's header quotes 600s windows, and the two lengths
# are not comparable, so the comparison below is against a FRESH 750s measurement of exactly what
# that file ships.
#
# ===================== MEASURED =====================
#
#   configuration                                   INPUT tok/s   reqs/window   TTFT     latency
#   the baseline variant, re-measured at 750s           3333.1          50       46.84s   265.49s
#   THIS FILE, three independent windows        5533.1/5599.8/5533.2   83/84/83  30.1s    143.0s
#
# +66% on throughput, and the per-request figures improve with it: TTFT -36%, end-to-end latency
# -46%. Against the vendor recipe running the vendor's OWN nightly build of the same runtime
# (70 and 72 requests over two windows), this is +17~19%.
#
# WHERE THE +66% COMES FROM, and why it cannot be split up:
#   runtime 0.30 -> 0.32, configuration untouched      3333.1 -> 4733.1   +42%
#   the four configuration changes, on 0.32            4733.1 -> 5533.1   +16.9%
#   together                                           1.42 x 1.169 = 1.66
# The configuration half is SUPERADDITIVE and that is not a rounding story: the static-kernel
# change alone is worth +0.1%, dropping speculative decoding alone is worth one request quantum,
# and the two together are worth five. So do not port one of these changes without the others, and
# re-measure anything you add on the newest base rather than on the recipe.
#
# THE FOUR CHANGES, each measured against the configuration immediately before it:
#
#   1. --speculative-config REMOVED                               +1 quantum alone, 5 with (2)
#      The checkpoint declares num_nextn_predict_layers: 1 while the recipe asks for 3 speculative
#      tokens. At 50K input the draft work is not repaid. (The method string in the recipe reads
#      "deepseek_mtp", which is cosmetic: vLLM rewrites the draft config from the checkpoint's own
#      model_type to Glm5NextMTPModel, so the GLM implementation is what runs either way.)
#
#   2. --additional-config ascend_compilation_config.enable_static_kernel: true
#      Worth +0.1% by itself and 4 further quanta once (1) is in. Note that the before-validator
#      copies this value into enable_super_kernel: the engine's own compiler line reads
#      "{'enable_static_kernel': True, 'enable_super_kernel': True}". Forcing super_kernel back to
#      false costs 2 quanta, so leave them together.
#
#   3. --max-num-batched-tokens 8192 -> 24576                                        +4 quanta
#      The engine's loggers line says what the bottleneck is: it alternates between
#      "prompt 9999.0 tok/s, generation 14.3 tok/s" and "prompt 0.0 tok/s, generation 396.7 tok/s"
#      with "Running: 16, Waiting: 0, NPU KV cache usage: 64-70%" throughout. A prefill chunk very
#      nearly stops the decode batch, and admission and KV capacity are not constraints. Wider
#      chunks buy fewer, bigger prefill steps.
#      THE LADDER SATURATES AT 24576, and it is bounded by the 1M context promise, not by taste:
#        16384 -> 79 reqs    24576 -> 80 reqs    32768 -> REFUSES TO START at 0.9
#          ValueError: To serve at least one request with the model's max seq len (1048576),
#          12.75 GiB KV cache is needed, which is larger than the available KV cache memory
#          (12.06 GiB)
#      Raising memory utilisation to 0.93 to buy that headroom measured identical to 24576, so
#      there is nothing above the ladder's top either way.
#
#   4. ASCEND_GLOBAL_LOG_LEVEL 1 -> 3                                                +3 quanta
#      The recipe runs the CANN runtime at INFO with a log path on disk, so it writes INFO records
#      for the whole window while eight cards launch MoE kernels. Level 3 is ERROR. Confirmed in a
#      second window (83 and 84 requests against the previous configuration's 80 twice over).
#      THE COST IS DIAGNOSTIC MATERIAL: the cann-diagnostics mount below will hold far less when
#      something goes wrong. Set it back to 1 while investigating a fault.
#
# THE FULL 1M CONTEXT IS FREE HERE, which the baseline variant's header could not yet say. At this
# file's chunk size, dropping --max-model-len to 131072 reproduces the 1M figure to the digit
# (80 requests either way). The earlier finding that context and chunk size were exclusive was a
# property of 65536-token chunks, which lose 17% on their own.
#
# MEASURED AND FLAT -- do not spend a window re-taking these:
#   HCCL_BUFFSIZE 200 instead of 1024 (verified in the pod environment, not assumed)
#   --stream-interval 10 instead of 1
#   ASCEND_GLOBAL_EVENT_ENABLE 0, on top of change (4)
#   additional_config enable_fused_mc2, weight_nz_mode 2, enable_prefill_mc2 (twice),
#     multistream_overlap_shared_expert
#   a 10-entry cudagraph_capture_sizes, with 10/10 captured in the log as proof it took effect
#   --gpu-memory-utilization 0.93
#   VLLM_USE_V2_MODEL_RUNNER 0 -- the older model runner is within drift of the newer one here
#   DROPPING --enable-expert-parallel: identical throughput (80 requests either way), with the
#     worker names in the log as evidence that it really was off (Worker_TP0 rather than
#     Worker_TP0_EP0, and no "Expert parallelism is enabled" line). At concurrency 16 the decode
#     batch is 14-16 tokens wide, so the per-step all-to-all has almost nothing to carry. The flag
#     is kept because the vendor recipe keeps it, not because it was shown to pay.
#
# MEASURED AND WORSE, in request quanta lost:
#   speculative decoding on (5)   enable_super_kernel false (2)   max-num-batched-tokens 65536 (14)
#   --max-num-seqs 256 (2)        a capture list reaching 1024 (2)
#   the vendor's own nightly build of this runtime (1-2)
#   TP2/DP4 on one node: -36.5%. Four data-parallel ranks each build a KV pool on two cards and it
#     collapses from 802,285 tokens to 142,114; TTFT 63s -> 153s.
#   PP2 x TP4: -42%, 48 requests against 83. It gets a LARGER pool (1,412,950 tokens against
#     1,063,228) and still loses, which is the clearest statement that this workload is not KV
#     bound. It also only starts inside a narrow memory window: at 0.9 the first real request dies
#     with "NPU out of memory ... 1.48 GiB ... 1.53 GiB free" on the second pipeline stage, and at
#     0.80 the engine refuses to start because 5.61 GiB of KV is below the 6.43 GiB that one
#     1M-token request needs at PP2.
#
# REFUSED AT START-UP, so not configuration results at all:
#   additional_config enable_shared_expert_dp -- takes ~0.7 GiB per card and leaves 12.06 GiB of
#     KV against the 12.75 GiB the 1M promise requires.
#   scheduler_config.profiling_chunk_config -- "requires pipeline parallelism (pp > 1)". Dynamic
#     chunk sizing is a Chunked Pipeline Parallelism feature and is deprecated in 0.32 besides.
#   xlite_graph_config -- the adapter ships in the image but the native runtime does not:
#     "ModuleNotFoundError: No module named 'xlite'" from every worker, before any weight loaded.
#
# ELIMINATED BY READING THE RUNTIME, with no window spent:
#   --async-scheduling is ALREADY ON. The field defaults to None and the config enables it unless
#     something incompatible is set; this configuration reaches the final "else: True".
#   --prefill-schedule-interval exists only in the data-parallel engine core, and this is DP1.
#   enable_balance_scheduling, dyntra_lb_config and short_request_first_config are all
#     data-parallel machinery, and every request in this workload is the same length anyway.
#   --block-size is a no-op: the platform assigns 128 when the flag is absent and returns early for
#     hybrid models, which this is.
#
# CORRECTNESS, run against THIS configuration rather than inherited from an earlier one:
#   determinism/arithmetic gate -- every question correct and identical across 5 repeats.
#   long-context gate -- 9 fresh requests of ~40K+ tokens, every one returned the right answer.
#
# IF FIRST-TOKEN LATENCY MATTERS MORE THAN THROUGHPUT, take this file MINUS changes (3) and (4),
# i.e. --max-num-batched-tokens 8192 and ASCEND_GLOBAL_LOG_LEVEL 1. That configuration measured
# INPUT 5066.5 and 5133.2 over two windows (76 and 77 requests), TTFT 14.0s, latency 164.9s: 8%
# less throughput than this file, and the only configuration measured here that beats the vendor
# recipe on throughput, TTFT and latency at the same time. This file spends TTFT (30s against 14s)
# to buy throughput and end-to-end latency.
#
# Which pool to land in (pod labels, node selector, tolerations, scheduler) is deliberately not set
# here: that belongs to the cluster, and a deploy passes it as overrides.
#
# No AutoTune run on this hardware. Every figure above is a one-variable comparison taken by hand
# on a single node, each against that node's own control, because two 910B4 nodes differ by about
# 30% at identical configuration and a cross-node ratio would mean nothing.
apiVersion: catalog.swiss/v2
kind: Variant
model: glm-5.3-flash
id: vllm-tp8-910b4-optimized
version: 1.0.0
servedName: GLM-5.3-Flash
description: >-
  Tuned: TP8/DP1 on one Ascend 910B4 node, 8 cards, using GLM-5.3-Flash-w8a8 weights and the full
  1M context. The vendor recipe on vLLM-Ascend 0.32 with speculative decoding removed, the static
  kernel on, a 24576-token prefill chunk and CANN logging at ERROR. 5533 INPUT tok/s at
  concurrency 16 (50K + 1.5K, 750s, engine-direct), +66% over the baseline variant measured in the
  same window, with TTFT 36% and latency 46% lower.
engine: vllm
chart:
  name: vllm
  # 0.9.1 renders requires.gpus under the site's resource (model.gpuResource).
  version: ">=0.9.1"
image:
  # By digest, because an "rc" tag is a moving target and every figure above belongs to this one
  # manifest. The tag v0.32.0rc1 resolves to it today. The vllm chart has no digest key and renders
  # "<repository>:<tag>", so the digest rides in the tag and "pinned" is ignored. quay serves it
  # anonymously. vllm 0.32.0 / vllm_ascend 0.32.0rc1 / torch 2.10.0 / torch_npu 2.10.0.post7.
  #
  # Do NOT substitute an "-a5-" tag. A5 is 950DT, this is A2, and the capability tables differ
  # where it matters: FP8_ATTENTION and the compressed-cache formats are A5-only.
  repository: quay.io/ascend/vllm-ascend
  tag: "pinned@sha256:ff6d1ea57df08dd9382c51d202d0dd2d9acc35d53a65bcb0dfd906886e674912"
requires:
  # A whole node.
  gpus: 8
  topology: single-node
  vendor: ascend
  gpuProduct:
    - Ascend-910B4
values:
  # Keep the API port on the pod network. On some Ascend sites every NodePort, and any socket bound
  # to the host's data address, answers from the public internet; the engine has no authentication
  # of its own, so it should not be published by default.
  hostNetwork: false
  securityContext:
    privileged: true
  model:
    # Pre-stage the weights here, or override the path in the site profile.
    localPath: /data/share/models/GLM-5.3-Flash-w8a8
    mountPath: /model
    hostPathType: Directory
    # = --max-model-len below: the checkpoint's own max_position_embeddings, so this variant serves
    # the full context. Measured to cost nothing at this file's chunk size -- see the header.
    contextLength: "1048576"
  modelCheck:
    requiredGlobs:
      - config.json
      - "*.safetensors"
  resources:
    requests:
      cpu: "32"
      memory: 768Gi
      ephemeral-storage: 16Gi
    limits:
      cpu: "32"
      memory: 768Gi
      ephemeral-storage: 16Gi
  shm:
    enabled: true
    sizeLimit: 1Gi
  extraArgs:
    - --trust-remote-code
    - --quantization=ascend
    # Not in the vendor script, and kept anyway: this is a served model, not a benchmark target.
    # Without them tool calls are not parsed and reasoning text leaks into content. They do not
    # affect throughput. All three move together -- vLLM refuses to start with
    # --enable-auto-tool-choice and no --tool-call-parser. glm47, NOT a glm53 name: GLM-5.3 reuses
    # the GLM-4.7 reasoning and tool-call surface and the parsers are registered under the older one.
    - --tool-call-parser=glm47
    - --reasoning-parser=glm47
    - --enable-auto-tool-choice
    - --data-parallel-size=1
    - --tensor-parallel-size=8
    # Measured flat on this hardware (see the header) and kept because the vendor recipe keeps it.
    - --enable-expert-parallel
    - --max-num-seqs=32
    - --seed=1024
    - --max-model-len=1048576
    # CHANGE (3): 8192 in the vendor recipe. The top of the ladder at this context length; 32768
    # does not start at 0.9. See the header before moving it.
    - --max-num-batched-tokens=24576
    # 0.9, NOT the vendor's 0.85, and the pairing is forced: at 0.85 the KV cache holds
    # 802,285 tokens, one 1,048,576-token request does not fit, and the engine REFUSES TO
    # START with "ValueError: To serve at least one request with the model's max seq len".
    # The two values move together or not at all. 0.93 was measured and changes nothing.
    - --gpu-memory-utilization=0.9
    - --limit-mm-per-prompt={"image":1,"video":0}
    - --compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,16,32,64,96,128]}
    # CHANGE (2). Only enable_static_kernel is set: the config's before-validator copies it into
    # enable_super_kernel, and forcing that one false costs 2 request quanta. Everything else in
    # the block stays at its default -- in particular enable_npugraph_ex (True) and
    # enable_cpu_binding (True), so naming this block does not cost CPU binding.
    - --additional-config={"ascend_compilation_config":{"enable_static_kernel":true}}
    # CHANGE (1): the vendor recipe passes
    #   --speculative-config={"method":"deepseek_mtp","num_speculative_tokens":3,"enforce_eager":true}
    # and removing it is worth 5 request quanta in combination with change (2). DO NOT RESTORE IT
    # without re-measuring: it is not a free option here.
    #
    # Load time only, not throughput: 311 GiB of weights read in about 18 minutes with these, which
    # is what VLLM_ENGINE_READY_TIMEOUT_S below is sized against.
    - --model-loader-extra-config={"enable_multithread_load":true,"num_threads":128}
    - --safetensors-load-strategy=lazy
    # DELIBERATELY ABSENT:
    #   --block-size   a no-op on this model: the platform assigns 128 when the flag is absent and
    #                  returns early for hybrid models, so passing 128 resolves to the same value.
  env:
    - name: VLLM_USE_V2_MODEL_RUNNER
      value: "1"
    - name: PYTORCH_NPU_ALLOC_CONF
      value: expandable_segments:True
    # 200 was measured and is identical; 1024 is kept as the vendor value.
    - name: HCCL_BUFFSIZE
      value: "1024"
    - name: HCCL_OP_EXPANSION_MODE
      value: AIV
    # Timeouts only: they decide how long a stuck call waits before it is called stuck.
    - name: VLLM_RPC_TIMEOUT
      value: "3600000"
    - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
      value: "3000"
    - name: HCCL_EXEC_TIMEOUT
      value: "3600"
    - name: HCCL_CONNECT_TIMEOUT
      value: "1200"
    # 311 GiB takes about 18 minutes to load; the engine's own default budget is shorter.
    - name: VLLM_ENGINE_READY_TIMEOUT_S
      value: "3600"
    - name: ASCEND_RT_VISIBLE_DEVICES
      value: "0,1,2,3,4,5,6,7"
    # CHANGE (4): 1 (INFO) in the vendor recipe, and worth 3 request quanta. 3 is ERROR. Set it
    # back to 1 when investigating a fault -- at 3 the mount below holds very little.
    - name: ASCEND_GLOBAL_LOG_LEVEL
      value: "3"
    - name: ASCEND_PROCESS_LOG_PATH
      value: /root/ascend/log
  volumes:
    - name: cann-diagnostics
      hostPath:
        path: /data/share/deployments/glm-5.3-flash-910b4-cann
        type: DirectoryOrCreate
  volumeMounts:
    - name: cann-diagnostics
      mountPath: /root/ascend/log
  # 90 minutes. The load is about 18, and graph capture adds a few more.
  startupProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  readinessProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 10
    failureThreshold: 3
  progressDeadlineSeconds: 7200
