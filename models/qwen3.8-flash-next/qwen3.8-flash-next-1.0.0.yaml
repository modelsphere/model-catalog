# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v1
name: qwen3.8-flash-next
version: 1.0.0
servedName: Qwen3.8-Flash-Next
variants:
  - id: sglang-tp8-h100-baseline
    description: 'Baseline: TP8 on eight H100 GPUs, single node.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.1"
    image:
      repository: lmsysorg/sglang
      tag: qwen38flashnext
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --enable-cache-report
        - --mamba-scheduler-strategy=extra_buffer
        - --reasoning-parser=qwen3
        - --stream-response-default-include-usage
        - --tool-call-parser=qwen3_coder
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
  - id: sglang-tp8-h100-optimized
    default: true
    description: 'Tuned by LLM AutoTune: TP8 on eight H100 GPUs, single node. +6% on the tuning benchmark vs the baseline variant.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.1"
    image:
      repository: lmsysorg/sglang
      tag: qwen38flashnext
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --chunked-prefill-size=16384
        - --enable-cache-report
        - --mamba-scheduler-strategy=extra_buffer
        - --max-prefill-tokens=16384
        - --mem-fraction-static=0.88
        - --reasoning-parser=qwen3
        - --stream-response-default-include-usage
        - --tool-call-parser=qwen3_coder
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
