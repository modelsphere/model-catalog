apiVersion: catalog.swiss/v1
name: modelforge-0.0.2
version: 1.0.0
servedName: kimi
variants:
  # Same hardware and same flags as models/modelforge, one notch higher on
  # --mem-fraction-static. The spelling is v0.5.15 argparse:
  # --mamba-radix-cache-strategy, not the --mamba-scheduler-strategy that the
  # v0.5.10 image in models/glm5.1 takes. A tag bump without a flag change
  # exits at startup.
  - id: sglang-tp2-h100
    default: true
    engine: sglang
    description: TP2 on two H100 or H800 GPUs, single node.
    chart:
      name: sglang
      version: 0.7.1
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: v0.5.15-cu129
    requires:
      gpus: 2
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
        - NVIDIA-H800
    values:
      model:
        mountPath: /models
        hostPathType: Directory
        # Never pinned: a number here would silently cap a 35B model.
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tp-size=2
        - --mamba-radix-cache-strategy=extra_buffer
        - --chunked-prefill-size=16384
        - --mem-fraction-static=0.85
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --reasoning-parser=qwen3
        - --tool-call-parser=qwen3_coder
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 80
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          enabled: true
          endpointSyncSeconds: 5
          drainSeconds: 600
          pollIntervalSeconds: 5
        shutdownReserveSeconds: 20
        forceShutdown: true
