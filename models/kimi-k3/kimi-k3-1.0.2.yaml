apiVersion: catalog.swiss/v1
name: kimi-k3
version: 1.0.2
servedName: kimi-k3
variants:
  - id: sglang-tp8-b300
    default: true
    engine: sglang
    description: TP8 with DCP8 on one eight-GPU B300 node, fp8 KV cache, DSPARK speculative decoding.
    chart:
      name: sglang
      version: ">=0.7.9"
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: v0.5.19
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-B300-SXM6-AC
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --trust-remote-code
        - --tp-size=8
        - --dcp-size=8
        - --kv-cache-dtype=fp8_e4m3
        - --mamba-full-memory-ratio=2
        - --max-running-requests=51
        - --chunked-prefill-size=16384
        - --mem-fraction-static=0.85
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --reasoning-parser=kimi_k3
        - --tool-call-parser=kimi_k3
        - --tokenizer-worker-num=4
        # DSPARK reads the draft weights from a second directory that must be
        # on the node too -- the flag below and the draft-model volume are one
        # decision, and the engine exits at startup if the path is empty.
        - --speculative-algorithm=DSPARK
        - --speculative-draft-model-path=/draft-model
        - --speculative-dspark-block-size=4
        - --enable-linear-replayssm-spec
        - --enable-hierarchical-cache
        - --hicache-size=150
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: TORCHINDUCTOR_COMPILE_THREADS
          value: "8"
      volumes:
        - name: draft-model
          hostPath:
            path: /mnt/disk0/models/Kimi-K3-DSpark
            type: Directory
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: draft-model
          mountPath: /draft-model
          readOnly: true
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      # 180 x 30s = 90 minutes, for the target weights and the draft model.
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true

  - id: vllm-tp8-b300
    engine: vllm
    image:
      repository: harbor.4pd.io/hardcore-tech/vllm/vllm-openai
      tag: v0.30.1-nightly-0961bbae-patch
    chart:
      name: vllm
      version: ">=0.4.6"
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-B300-SXM6-AC
    values:
        env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
        - name: MOONCAKE_CONFIG_PATH
          value: /root/mc-config/mooncake_vllm_config.json
        - name: MOONCAKE_MASTER
          value: etcd://172.26.3.13:2379;172.26.3.14:2379
        - name: MOONCAKE_TE_META_DATA_SERVER
          value: P2PHANDSHAKE
        - name: MOONCAKE_PROTOCOL
          value: rdma
        - name: MOONCAKE_DEVICE
          value: mlx5_10
        - name: MC_MS_FILTERS
          value: mlx5_10
        - name: MOONCAKE_GLOBAL_SEGMENT_SIZE
          value: "0"
        - name: TORCHINDUCTOR_COMPILE_THREADS
          value: "8"
        - name: PYTHONHASHSEED
          value: "0"
        - name: VLLM_ALLREDUCE_USE_FLASHINFER
          value: "1"
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "3600"
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: "1"
        - name: VLLM_USE_RUST_FRONTEND
          value: "0"
        extraArgs:
        - --trust-remote-code
        - --gpu-memory-utilization=0.9
        - --tensor-parallel-size=8
        - --load-format=fastsafetensors
        - --no-enable-flashinfer-autotune
        - --kv-cache-dtype=fp8
        - --enable-prefix-caching
        - --enable-prompt-tokens-details
        - --prefix-match-unit=128
        - --max-num-seqs=48
        - --enable-auto-tool-choice
        - --tool-call-parser=kimi_k3
        - --reasoning-parser=kimi_k3
        - --allowed-media-domains=no-network.invalid
        - --decode-context-parallel-size=8
        - --dcp-comm-backend=a2a
        - --attention-backend=TOKENSPEED_MLA
        - --attention-config={"use_prefill_query_quantization":true,"mla_prefill_backend":"TRTLLM_RAGGED"}
        - '--speculative-config={"model":"/draft-model", "num_speculative_tokens":4, "attention_backend":"FLASHINFER_MLA",
          "method": "dspark", "draft_sample_method": "probabilistic", "rejection_sample_method":
          "block"}'
        - |
          --kv-transfer-config={
          "kv_connector": "MultiConnector",
          "kv_role": "kv_both",
          "kv_connector_extra_config": {
            "connectors": [
              {
                "kv_connector": "SimpleCPUOffloadConnector",
                "kv_role": "kv_both",
                "kv_connector_extra_config": {
                  "cpu_bytes_to_use": 1319413953331,
                  "lazy_offload": false
                }
              },
              {
                "kv_connector": "MooncakeStoreConnector",
                "kv_role": "kv_both"
              }
            ]
          }}
        hangWatcher:
          config:
            activeProbeTimeoutSec: 120
            stallSec: 900
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 30
        lifecycle:
          preStop:
            drainSeconds: 900
            enabled: true
            endpointSyncSeconds: 10
            pollIntervalSeconds: 5
          shutdownTimeout: 120
        model:
          maxLen: "1048576"
          mountPath: /model
        progressDeadlineSeconds: 5400
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            ephemeral-storage: 64Gi
            rdma/hca_shared: "1"
          requests:
            cpu: "16"
            ephemeral-storage: 64Gi
        schedulerName: volcano
        securityContext:
          capabilities:
            add:
            - SYS_PTRACE
            - SYS_NICE
            - IPC_LOCK
        service:
          port: 8050
        startupProbe:
          failureThreshold: 280
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 10
        terminationGracePeriodSeconds: 1200
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
        - mountPath: /draft-model
          name: draft-model
          readOnly: true
        - mountPath: /root/.cache
          name: compile-cache
        - mountPath: /root/mc-config
          name: mooncake-config
          readOnly: true
        volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 32Gi
          name: shm
        - hostPath:
            path: /mnt/disk0/models/Kimi-K3-DSpark-vllm
            type: Directory
          name: draft-model
        - emptyDir:
            sizeLimit: 32Gi
          name: compile-cache
        - hostPath:
            path: /mnt/disk0/models/config/mc-config
            type: Directory
          name: mooncake-config

