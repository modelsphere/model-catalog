apiVersion: catalog.swiss/v1
name: kimi-k3
version: 1.0.0
servedName: kimi-k3
variants:
  # Fits on one node, unlike K2.5: TP8 across the eight cards of a single B300,
  # with decode context parallel over the same eight. No LWS, no RDMA.
  - id: sglang-tp8-b300
    default: true
    engine: sglang
    description: TP8 with DCP8 on one eight-GPU B300 node, fp8 KV cache, DSPARK speculative decoding.
    chart:
      name: sglang
      version: 0.8.0
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: v0.5.19
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-B300-SXM6-AC
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --trust-remote-code
        - --tp-size=8
        - --dcp-size=8
        - --kv-cache-dtype=fp8_e4m3
        - --mamba-full-memory-ratio=1
        - --max-running-requests=36
        - --chunked-prefill-size=16384
        - --mem-fraction-static=0.85
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --reasoning-parser=kimi_k3
        - --tool-call-parser=kimi_k3
        - --tokenizer-worker-num=4
        # DSPARK reads the draft weights from a second directory that must be
        # on the node too -- the flag below and the draft-model volume are one
        # decision, and the engine exits at startup if the path is empty.
        - --speculative-algorithm=DSPARK
        - --speculative-draft-model-path=/draft-model
        - --speculative-dspark-block-size=4
        - --enable-linear-replayssm-spec
        - --enable-hierarchical-cache
        - --hicache-size=150
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: TORCHINDUCTOR_COMPILE_THREADS
          value: "8"
      volumes:
        - name: draft-model
          hostPath:
            path: /mnt/disk0/models/Kimi-K3-DSpark
            type: Directory
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: draft-model
          mountPath: /draft-model
          readOnly: true
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      # 180 x 30s = 90 minutes, for the target weights and the draft model.
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
