# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v1
name: kimi-k3
version: 1.0.5
servedName: kimi-k3
variants:
  - id: sglang-tp8-b300-baseline
    description: 'Baseline: TP8 on eight B300 GPUs, single node.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.9"
    image:
      repository: lmsysorg/sglang
      tag: v0.5.19
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-B300-SXM6-AC
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --enable-cache-report
        - --reasoning-parser=kimi_k3
        - --stream-response-default-include-usage
        - --tool-call-parser=kimi_k3
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 11100
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 310
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
  - id: sglang-tp8-b300-optimized
    default: true
    description: 'Tuned by LLM AutoTune: TP8 on eight B300 GPUs, single node, fp8 KV cache, DSPARK speculative decoding, hierarchical KV cache. Normalized throughput within the SLO vs the baseline variant: +57.6% (50k + 1.5k), +21.4% (8k + 1k).'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.9"
    image:
      repository: lmsysorg/sglang
      tag: v0.5.19
      digest: sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-B300-SXM6-AC
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --chunked-prefill-size=16384
        - --dcp-size=8
        - --enable-cache-report
        - --enable-hierarchical-cache
        - --enable-linear-replayssm-spec
        - --hicache-size=150
        - --kv-cache-dtype=fp8_e4m3
        - --mamba-full-memory-ratio=2
        - --max-running-requests=51
        - --mem-fraction-static=0.85
        - --reasoning-parser=kimi_k3
        - --speculative-algorithm=DSPARK
        - --speculative-draft-model-path=/draft-model
        - --speculative-dspark-block-size=4
        - --stream-response-default-include-usage
        - --tokenizer-worker-num=4
        - --tool-call-parser=kimi_k3
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: TORCHINDUCTOR_COMPILE_THREADS
          value: '8'
      volumes:
        - name: draft-model
          hostPath:
            path: /mnt/disk0/models/Kimi-K3-DSpark
            type: Directory
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: draft-model
          mountPath: /draft-model
          readOnly: true
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 9300
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 250
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true

  - id: vllm-tp8-b300
    engine: vllm
    image:
      repository: harbor.4pd.io/hardcore-tech/vllm/vllm-openai
      tag: v0.30.1-nightly-0961bbae-patch
    chart:
      name: vllm
      version: ">=0.4.6"
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-B300-SXM6-AC
    values:
        env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
        - name: MOONCAKE_CONFIG_PATH
          value: /root/mc-config/mooncake_vllm_config.json
        - name: MOONCAKE_MASTER
          value: etcd://172.26.3.13:2379;172.26.3.14:2379
        - name: MOONCAKE_TE_META_DATA_SERVER
          value: P2PHANDSHAKE
        - name: MOONCAKE_PROTOCOL
          value: rdma
        - name: MOONCAKE_DEVICE
          value: mlx5_10
        - name: MC_MS_FILTERS
          value: mlx5_10
        - name: MOONCAKE_GLOBAL_SEGMENT_SIZE
          value: "0"
        - name: TORCHINDUCTOR_COMPILE_THREADS
          value: "8"
        - name: PYTHONHASHSEED
          value: "0"
        - name: VLLM_ALLREDUCE_USE_FLASHINFER
          value: "1"
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "3600"
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: "1"
        - name: VLLM_USE_RUST_FRONTEND
          value: "0"
        extraArgs:
        - --trust-remote-code
        - --gpu-memory-utilization=0.9
        - --tensor-parallel-size=8
        - --load-format=fastsafetensors
        - --no-enable-flashinfer-autotune
        - --kv-cache-dtype=fp8
        - --enable-prefix-caching
        - --enable-prompt-tokens-details
        - --prefix-match-unit=128
        - --max-num-seqs=48
        - --enable-auto-tool-choice
        - --tool-call-parser=kimi_k3
        - --reasoning-parser=kimi_k3
        - --allowed-media-domains=no-network.invalid
        - --decode-context-parallel-size=8
        - --dcp-comm-backend=a2a
        - --attention-backend=TOKENSPEED_MLA
        - --attention-config={"use_prefill_query_quantization":true,"mla_prefill_backend":"TRTLLM_RAGGED"}
        - '--speculative-config={"model":"/draft-model", "num_speculative_tokens":4, "attention_backend":"FLASHINFER_MLA",
          "method": "dspark", "draft_sample_method": "probabilistic", "rejection_sample_method":
          "block"}'
        - |
          --kv-transfer-config={
          "kv_connector": "MultiConnector",
          "kv_role": "kv_both",
          "kv_connector_extra_config": {
            "connectors": [
              {
                "kv_connector": "SimpleCPUOffloadConnector",
                "kv_role": "kv_both",
                "kv_connector_extra_config": {
                  "cpu_bytes_to_use": 1319413953331,
                  "lazy_offload": false
                }
              },
              {
                "kv_connector": "MooncakeStoreConnector",
                "kv_role": "kv_both"
              }
            ]
          }}
        hangWatcher:
          config:
            activeProbeTimeoutSec: 120
            stallSec: 900
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 30
        lifecycle:
          preStop:
            drainSeconds: 900
            enabled: true
            endpointSyncSeconds: 10
            pollIntervalSeconds: 5
          shutdownTimeout: 120
        model:
          maxLen: "1048576"
          mountPath: /model
        progressDeadlineSeconds: 5400
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            ephemeral-storage: 64Gi
            rdma/hca_shared: "1"
          requests:
            cpu: "16"
            ephemeral-storage: 64Gi
        schedulerName: volcano
        securityContext:
          capabilities:
            add:
            - SYS_PTRACE
            - SYS_NICE
            - IPC_LOCK
        service:
          port: 8050
        startupProbe:
          failureThreshold: 280
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
          timeoutSeconds: 10
        terminationGracePeriodSeconds: 1200
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
        - mountPath: /draft-model
          name: draft-model
          readOnly: true
        - mountPath: /root/.cache
          name: compile-cache
        - mountPath: /root/mc-config
          name: mooncake-config
          readOnly: true
        volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 32Gi
          name: shm
        - hostPath:
            path: /mnt/disk0/models/Kimi-K3-DSpark-vllm
            type: Directory
          name: draft-model
        - emptyDir:
            sizeLimit: 32Gi
          name: compile-cache
        - hostPath:
            path: /mnt/disk0/models/config/mc-config
            type: Directory
          name: mooncake-config


  - id: vllm-tp8-pp4-6000d
    engine: vllm
    description: TP8 per node, PP4 across four nodes over RoCE. A Marlin MoE path is required on sm120, to keep the 4-bit weights 4-bit; the default runner upcasts them to bf16 and does not fit. sglang reaches the same shape with --moe-runner-backend marlin.
    chart:
      name: vllm
      version: ">=0.7.6"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 8 # per pod; 32 across the group
      nodes: 4
      topology: lws
      rdma: true
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/Kimi-K3
        mountPath: /models
        contextLength: "1048576"
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      lws:
        enabled: true
        size: 4
      hostNetwork: true
      rdma:
        enabled: true
      extraArgs:
        - --tensor-parallel-size=8
        - --pipeline-parallel-size=4
        - --gpu-memory-utilization=0.90
        # Autotune has to be off whenever PP > 1.
        - --no-enable-flashinfer-autotune
        - --enable-prefix-caching
        - --prefix-match-unit=128
        - --max-num-batched-tokens=8192
        - --max-num-seqs=48
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=no-network.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=kimi_k3
        - --reasoning-parser=kimi_k3
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        # The trtllm fused-MoE autotuner picks shapes that are not built for
        # sm120; skipping those ops leaves the rest of the autotuner on.
        - name: VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS
          value: trtllm::fused_moe::gemm1,trtllm::fused_moe::gemm2,fp8_gemm
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: NCCL_DEBUG
          value: INFO
        - name: NCCL_SOCKET_IFNAME
          value: bond0
        - name: GLOO_SOCKET_IFNAME
          value: bond0
        - name: NCCL_NET_GDR_LEVEL
          value: "1"
      service:
        port: 8050
      hangWatcher:
        enabled: true

  - id: sglang-tp8-pp4-6000d
    engine: sglang
    description: >-
      TP8 per node, PP4 across four nodes over RoCE. Marlin is the only correct
      MoE runner here: the default upcasts the MXFP4 experts to bf16 and needs
      ~6000 GiB, triton_kernel fails in the weight loader, and flashinfer_mxfp4
      loads, serves and computes wrong answers. Measured 47.81 GiB of weights
      per card and max_total_num_tokens 1,237,195.
    chart:
      name: sglang
      version: ">=0.7.0"
    image:
      repository: lmsysorg/sglang
      tag: v0.5.20
    requires:
      gpus: 8 # per pod; 32 across the group
      nodes: 4
      topology: lws
      rdma: true
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/Kimi-K3
        mountPath: /model
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      lws:
        enabled: true
        size: 4
      hostNetwork: true
      rdma:
        enabled: true
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NCCL_DEBUG
          value: WARN
        - name: NCCL_IB_DISABLE
          value: "0"
        - name: NCCL_NET_GDR_LEVEL
          value: "1"
        - name: NCCL_SOCKET_IFNAME
          value: bond0
        - name: GLOO_SOCKET_IFNAME
          value: bond0
      extraArgs:
        - --tp-size=8
        - --pp-size=4
        # The one flag that makes this model correct on sm120.
        - --moe-runner-backend=marlin
        - --mem-fraction-static=0.85
        - --trust-remote-code
        - --enable-metrics
        - --enable-cache-report
        # Without these the thinking text lands in content, carrying a stray
        # <|clos... token with it. That is a missing flag, not a wrong answer.
        - --reasoning-parser=kimi_k3
        - --tool-call-parser=kimi_k3
      service:
        port: 8050
      # The KDA linear-attention kernels compile on first start, so this model
      # comes up slower under sglang than under vLLM.
      progressDeadlineSeconds: 7200
      hangWatcher:
        enabled: true
