# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v1
name: nemotron-3.5-lightning-30b-a3b
version: 1.0.0
servedName: Nemotron-3.5-Lightning-30B-A3B
variants:
  - id: sglang-tp1-h100-baseline
    description: 'Baseline: TP1 on one H100 GPU, single node.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.8.0"
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: dev-dsv41
    requires:
      gpus: 1
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --chat-template=/model/chat_template.jinja
        - --cuda-graph-max-bs-decode=16
        - --enable-cache-report
        - --mamba-ssm-dtype=float16
        - --mem-fraction-static=0.85
        - --reasoning-parser=nemotron_3
        - --stream-response-default-include-usage
        - --tool-call-parser=qwen3_coder
        - --tp-size=1
        - --trust-remote-code
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
  - id: sglang-tp1-dp8-h100-optimized
    default: true
    description: 'Tuned by LLM AutoTune: TP1 DP8 on eight H100 GPUs, single node. +27% on the tuning benchmark vs the baseline variant.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.8.0"
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: dev-dsv41
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --chat-template=/model/chat_template.jinja
        - --chunked-prefill-size=16384
        - --dp-size=8
        - --enable-cache-report
        - --mamba-scheduler-strategy=extra_buffer
        - --mamba-ssm-dtype=float16
        - --mem-fraction-static=0.88
        - --reasoning-parser=nemotron_3
        - --stream-response-default-include-usage
        - --tool-call-parser=qwen3_coder
        - --tp-size=1
        - --trust-remote-code
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
