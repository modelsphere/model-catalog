apiVersion: catalog.swiss/v2
kind: Variant
model: glm5.3
id: sglang-tp8-ep8-pd-l3-6000d
version: 1.0.0
servedName: glm-5.3
engine: sglang
description: >-
  Prefill/decode-disaggregated DisaggregatedSet, TP8 EP8 on ONE node per role
  on RTX 6000D, with Mooncake NVMe-oF as L3 (HiCache storage backend) against a
  shared EBOF array. 1 prefill + 1 decode. Read-back from the array is
  verified, not assumed: a prefix written by one prefill engine is served to a
  restarted one with matched=0 loaded=9152, the storage NICs carrying the
  bytes. Unlike sglang-tp8-pp2-ep8-pd-l2-6000d it uses one node per role, L3
  rather than L2 only, and a Mooncake NoF image.
chart:
  name: sglang
  version: ">=0.9.26"
# NOT the stock sglang image. L3 here writes to NVMe-oF through SPDK, which
# needs a client built with USE_NOF=ON plus the EBOF patch set. Measured with
# stock lmsysorg/sglang on this hardware: the Mooncake client connects and
# warms up, then every rank dies registering its host pool --
#   rdma_context.cpp: Failed to register memory 0x...: Invalid argument [22]
#   RuntimeError: Failed to register buffer to Mooncake Store, error code: -600
image:
  repository: harbor.maas.21vcloud.com/4paradigm/sglang-hicache-nof
  tag: v0.5.21-ebof-20261026
requires:
  # Per-role per-pod GPUs are in values.pd.{prefill,decode}.gpus ("8"); total
  # GPUs are a deploy-time choice, so there is no single number here.
  gpus: 1
  topology: pd
  rdma: true
  gpuProduct:
    - NVIDIA-RTX-6000D
  # Not expressible in this block, but required on every node this lands on:
  #   * 2 MiB hugepages reserved AND advertised by kubelet (kubelet reads
  #     HugePages_Total only at startup, so reserving without restarting it
  #     leaves allocatable at 0 and the pod pends forever)
  #   * routes to the EBOF targets (10.66.3/4 via 10.66.1/2)
  #   * nvidia_peermem loaded -- a node on the inbox RDMA stack cannot load it,
  #     and the PD KV transfer then fails with ibv_reg_mr EFAULT
  #     ("Failed to register memory ...: Bad address [14]") while raw RoCE
  #     between the same two nodes runs at full speed. Measured on p6kd-37.
values:
  model:
    localPath: /data/models/GLM-5.3-NVFP4
    mountPath: /models
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tp-size=8
    # Required, not tuning: under plain TP8 the MoE weight loader dies with a
    # factor-of-2 shape mismatch (w13 3072 vs 6144), because TP slices a
    # dimension the fp4 packing has already folded. Changing the MoE runner
    # backend does not help -- the failure is in the loader, before apply().
    - --ep-size=8
    - --quantization=modelopt_fp4
    - --disable-overlap-schedule
    # A ceiling, not a choice: 0.90 / 0.85 / 0.80 were each measured and each
    # died at CUDA-graph capture, which takes whatever is free and then asks
    # for ~2 GiB more, so lowering this never catches up.
    - --mem-fraction-static=0.72
    - --disable-custom-all-reduce
    - --reasoning-parser=glm45
    - --tool-call-parser=glm47
    - --trust-remote-code
    - --enable-metrics
    # Without this the engine reports no cached_tokens at all, and a
    # prefix-cache check reads zero however well the cache is working.
    - --enable-cache-report
  env:
    # Mooncake cannot register expandable-segment memory for RDMA.
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:False
    # Required. Unset, Mooncake allocates the L2 host pool from ordinary
    # memory and every NoF transfer fails with
    # "RDMA memory translation failed, rc -22".
    - name: MC_STORE_USE_HUGEPAGE
      value: "1"
    - name: MC_STORE_HUGEPAGE_SIZE
      value: 2MB
    # --- Mooncake client: control plane to the master, data plane via SPDK.
    # The master is shared and lives outside Kubernetes; point these at
    # whichever host runs it.
    - name: MOONCAKE_MASTER
      value: 10.97.11.37:50053
    - name: MOONCAKE_TE_META_DATA_SERVER
      value: http://10.97.11.37:8082/metadata
    - name: MOONCAKE_PROTOCOL
      value: rdma
    - name: MOONCAKE_DEVICE
      value: mlx5_3,mlx5_4
    # Must NOT be 0: the startup warmup put still needs a DRAM segment.
    - name: MOONCAKE_GLOBAL_SEGMENT_SIZE
      value: 1gb
    - name: NCCL_SOCKET_IFNAME
      value: bond0
    - name: GLOO_SOCKET_IFNAME
      value: bond0
    - name: NCCL_NET_GDR_LEVEL
      value: "1"
  shm:
    enabled: true
    sizeLimit: 64Gi
  service:
    port: 8050
  hangWatcher:
    enabled: true
  hostNetwork: true
  rdma:
    enabled: true
  scaler:
    enabled: false
  # SPDK needs these three, and NOT privileged: a privileged container on this
  # cluster receives every device on the host, which silently defeats the GPU
  # device plugin -- a pod requesting 4 GPUs was measured seeing all 8, so two
  # engines bound the same cards and the second died out of memory while four
  # cards sat idle.
  #   SYS_ADMIN     DPDK's vtophys reads physical page numbers from
  #                 /proc/self/pagemap
  #   IPC_LOCK      pinning RDMA buffers
  #   SYS_RESOURCE  raising the hugepage / memlock limits
  securityContext:
    capabilities:
      add: ["SYS_ADMIN", "IPC_LOCK", "SYS_RESOURCE"]
  # hostPath, NOT emptyDir medium: HugePages. This key is global -- the chart
  # applies it to every pod it makes, the ROUTER included -- and a HugePages
  # emptyDir requires the mounting pod to request hugepages. The router has no
  # such request, so it dies at "MountVolume.SetUp failed ... hugePages storage
  # requested, but there is no resource request for huge pages", never runs its
  # wait-upstreams init container, and the PD trio never completes -- with no
  # error on either engine.
  volumes:
    - name: hugepages
      hostPath:
        path: /dev/hugepages
    - name: engine-cache
      hostPath:
        path: /data/cache/glm-5.3-nvfp4/sglang
        type: DirectoryOrCreate
  volumeMounts:
    - name: hugepages
      mountPath: /dev/hugepages
    - name: engine-cache
      mountPath: /root/.cache
  resources:
    # cpu/memory are mandatory alongside hugepages: the API server refuses the
    # workload with "HugePages require cpu or memory", and that refusal reaches
    # neither the pod nor the Helm release -- it appears only in the LWS
    # controller log, so the symptom is "deploy succeeded, no pod ever appears".
    requests:
      cpu: "16"
      memory: 128Gi
    limits:
      # Per POD, and both roles get this block.
      #   --hicache-size=4          4.00 GB/rank   KV host pool
      #   DSA indexer               1.61 GB/rank   separate, NOT covered above
      #   MOONCAKE_GLOBAL_SEGMENT   1.00 GiB/rank  allocated LAST
      #                           ~6.6 GB x 8 ranks ~= 53 GiB
      # Sizing this short is deceptive: both pools fit, the SEGMENT does not,
      # and it surfaces as "Failed to allocate segment memory" -> error code
      # -600, which reads like the master is unreachable.
      # The decode role runs no hierarchical cache and needs only SPDK's own
      # ~20 MB, but the chart has no per-role resources key; a hugetlb limit is
      # a cap, not a reservation, so the unused half costs nothing.
      hugepages-2Mi: 56Gi
  # The chart's default startupProbe kills a PD engine after ~4 minutes, while
  # it is still inside sglang's PD warmup. Being killed there looks exactly
  # like a hang.
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  progressDeadlineSeconds: 7200
  # Cluster-specific, and unavoidable here: the nodes prepared for EBOF carry
  # taints so that ordinary workloads stay off them. A variant that omits
  # these schedules nowhere, and the only symptom is Pending with
  # "1 node(s) had untolerated taint(s)" among a pile of other reasons.
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
    - {key: ebof-test, operator: Exists, effect: NoSchedule}
    - {key: dedicated, operator: Exists, effect: NoSchedule}
  pd:
    enabled: true
    colocate: false
    prefill:
      gpus: "8"
      replicas: 1
      # One node per role: 433 GiB of weights is 54 GiB of each 83 GiB card at
      # TP8, so a role fills a node by itself.
      size: 1
      extraArgs:
        # L2 + L3 live HERE rather than under localKVOffload, which the chart
        # applies to BOTH roles. A PD decode engine runs with
        # disaggregation_decode_enable_radix_cache=false and
        # disaggregation_decode_enable_offload_kvcache=false (its own
        # server_args dump says so): it receives KV over the transfer engine
        # instead of matching prefixes, so a hierarchical cache there caches
        # nothing while costing a second host pool and a second Mooncake client.
        - --enable-hierarchical-cache
        # An absolute size per rank, not --hicache-ratio. The ratio multiplies
        # the DEVICE KV pool, which here is whatever the 433 GiB of weights
        # left over (~5.8 GiB per card) and has nothing to do with how much L2
        # this deployment wants. At ratio 0.25 each rank got 1.45 GB and a
        # 9200-token read hung for over 600 s.
        - --hicache-size=4
        - --hicache-storage-backend=mooncake
        # `timeout`, not `wait_complete`. wait_complete waits for a prefetch
        # with NO upper bound, and sglang's PD warmup request goes through the
        # same path; on DeepSeek-V4, whose L3 writes are rejected and whose
        # prefetches therefore cannot finish, that hung the warmup until the
        # 300 s scheduler watchdog fired and /health answered 503 forever.
        # GLM-5.3's prefetches do complete, so wait_complete may well be safe
        # here, but this is the setting that is known not to hang.
        #
        # The DEFAULT budget is far too small either way: 1 s + 0.25 s per 1Ki
        # tokens, i.e. 1.6 s for a 2.7k-token prefix, which a cold read off the
        # array does not meet. Worse, an abandoned prefetch logs NOTHING, so L3
        # looks like it was never consulted. The two knobs live inside
        # --hicache-storage-backend-extra-config, not in flags of their own.
        - --hicache-storage-prefetch-policy=timeout
        # replica_num 0 / nof_replica_num 1 = pure NoF: no DRAM replica, one
        # replica on the EBOF volumes.
        - '--hicache-storage-backend-extra-config={"replica_num": 0, "nof_replica_num": 1, "prefetch_timeout_base": 10, "prefetch_timeout_per_ki_token": 2.0}'
    decode:
      gpus: "8"
      replicas: 1
      size: 1
      # No hicache flags on purpose -- see the prefill role above.
  # Left off: this block is global and would render the hicache flags onto the
  # decode role too.
  localKVOffload:
    enabled: false
