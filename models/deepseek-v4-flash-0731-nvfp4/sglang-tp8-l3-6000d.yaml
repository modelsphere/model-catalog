apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash-0731-nvfp4
id: sglang-tp8-l3-6000d
version: 1.0.0
servedName: deepseek-v4-flash-0731-nvfp4
engine: sglang
description: >-
  TP8 on one RTX 6000D node with HiCache: L2 in hugepages (ratio 2) and
  Mooncake NVMe-oF as L3 on a shared EBOF array, through a standalone
  (non-HA) master. Measured: 5 rounds of 8 x 8.4k-token prefixes read back in
  parallel plus 2 x 28k serial after an engine restart hit 100% of the
  cacheable tokens from L3 with every needle answered, and a per-object md5
  trace of every KV pool matched what was written. Decode 120 tok/s at
  concurrency 1, 608 tok/s aggregate at 8.
chart:
  name: sglang
  version: ">=0.9.26"
# The image is a private build for now and must be published to a public
# registry before this variant can be deployed outside the site that built it.
# NOT the stock sglang image: L3 here is NVMe-oF through SPDK, which needs a
# Mooncake client built with USE_NOF=ON plus the EBOF patch set, and the
# 512-byte page padding below exists only in these images. This tag is
# ebof-20261102 with one file changed: sglang's mooncake_store.py restores the
# CPU affinity that Mooncake's SPDK init takes away. Without it setup() pins
# all eight scheduler threads to CPU 0 (measured: decode 39 vs 120 tok/s).

# These ebof clients cannot use an etcd HA master ("Invalid HA backend entry"),
# hence the standalone master below.
image:
  repository: harbor.maas.21vcloud.com/4paradigm/sglang-hicache-nof
  tag: v0.5.21-ebof-20261102-affinity
requires:
  gpus: 8
  topology: single-node
  rdma: true
  gpuProduct:
    - NVIDIA-RTX-6000D
  # Not expressible in this block, but required on the node:
  #   * ~650 GiB of 2 MiB hugepages reserved AND advertised by kubelet
  #   * routes to the EBOF targets on the storage NICs
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
    mountPath: /models
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    # This engine fetches client-supplied http(s) media URLs server-side, and
    # with no allowlist any domain is allowed. On a hostNetwork pod that turns
    # an image_url into a request from the node itself. An allowlist matching
    # no real host refuses them all.
    - --allowed-media-domains=none.invalid
    - --tp-size=8
    # Required on sm120: the default trtllm runner has no sm120 kernels and
    # flashinfer_cutlass serves but miscomputes.
    - --moe-runner-backend=marlin
    - --mem-fraction-static=0.80
    - --chunked-prefill-size=4096
    - --max-prefill-tokens=4096
    - --trust-remote-code
    - --enable-metrics
    - --enable-cache-report
    - '--default-chat-template-kwargs={"thinking": true}'
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
    - --enable-hierarchical-cache
    # A ratio, not --hicache-size: DeepSeek V4 HiCache refuses an absolute size
    # ("use --hicache-ratio instead"). At 2 the host pools come to 85 GB per
    # rank (swa 30.2, c4 36.9, c4_indexer 8.3, c4_state 6.5, c128 1.6,
    # c4_indexer_state 1.6), ~636 GiB of hugepages over eight ranks.
    - --hicache-ratio=2
    # Required for L3 on NVMe-oF, not tuning. NoF moves whole 512-byte blocks;
    # with the default page_first layout the per-page objects of four pools are
    # 786240 / 177408 / 34560 / 6439680 bytes, the client rejects every one
    # ("NoF request ... is not aligned to block size 512" -> TRANSFER_FAIL),
    # and nothing but the two state pools ever reaches L3. page_first_direct
    # pads each page's stride to a 512-byte multiple (786432 / 177664 / 34816 /
    # 6439936), and its transfer path exists only with the direct IO backend.
    # Decode speed was the same with direct as with kernel.
    - --hicache-mem-layout=page_first_direct
    - --hicache-io-backend=direct
    - --hicache-storage-backend=mooncake
    # timeout, with a budget that a cold read off the array meets; the default
    # (1 s + 0.25 s per 1Ki tokens) abandons prefetches silently.
    - --hicache-storage-prefetch-policy=timeout
    # replica_num 0 / nof_replica_num 1 = pure NoF: no DRAM replica, one replica
    # on the EBOF volumes.
    - '--hicache-storage-backend-extra-config={"replica_num": 0, "nof_replica_num": 1, "prefetch_timeout_base": 10, "prefetch_timeout_per_ki_token": 2.0}'
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    # Mooncake cannot register expandable-segment memory for RDMA.
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:False
    # Required. Unset, the L2 host pool comes from ordinary memory and every
    # NoF transfer fails with "RDMA memory translation failed, rc -22".
    - name: MC_STORE_USE_HUGEPAGE
      value: "1"
    - name: MC_STORE_HUGEPAGE_SIZE
      value: 2MB
    # Required for hugepage-backed pools >= 4 GiB: without it registration dies
    # with "Failed to register memory ...: Invalid argument [22]" -> -600.
    - name: RDMAV_HUGEPAGES_SAFE
      value: "1"
    # Per process, per worker. At the 4 MiB default, eight ranks reading one
    # long prefix back at once tore NoF qpairs down (CQ transport error -6 ->
    # SQ DELETION) and 63-82% of the prefix missed, every round; at 1 MiB six
    # rounds out of six hit 100%. Measured 2026-11-03.
    - name: MC_NOF_INFLIGHT_BYTES_LIMIT
      value: "1048576"
    # --- Mooncake client. The master is standalone, outside Kubernetes, and
    # must own NoF volumes that no other master holds. SITE-SPECIFIC: replace
    # the placeholder host with yours (e.g. through the deploy-time overrides).
    - name: MOONCAKE_MASTER
      value: mooncake-master.example:50051
    - name: MOONCAKE_TE_META_DATA_SERVER
      value: http://mooncake-master.example:8080/metadata
    - name: MOONCAKE_PROTOCOL
      value: rdma
    # The storage NICs; left to auto-detect Mooncake has picked the management
    # NIC on this cluster.
    - name: MOONCAKE_DEVICE
      value: mlx5_3,mlx5_4
    # Must NOT be 0: the startup warmup put still needs a DRAM segment.
    - name: MOONCAKE_GLOBAL_SEGMENT_SIZE
      value: 1gb
  shm:
    enabled: true
    sizeLimit: 64Gi
  service:
    port: 8050
  hangWatcher:
    enabled: true
  hostNetwork: true
  rdma:
    enabled: true
  scaler:
    enabled: false
  # SPDK needs these three, and NOT privileged: a privileged container receives
  # every device on the host, which defeats the GPU device plugin.
  securityContext:
    capabilities:
      add: ["SYS_ADMIN", "IPC_LOCK", "SYS_RESOURCE"]
  volumes:
    - name: hugepages
      hostPath:
        path: /dev/hugepages
    - name: engine-cache
      hostPath:
        path: /data/cache/deepseek-v4-flash-0731-nvfp4/sglang
        type: DirectoryOrCreate
  volumeMounts:
    - name: hugepages
      mountPath: /dev/hugepages
    - name: engine-cache
      mountPath: /root/.cache
  resources:
    # cpu/memory are mandatory alongside hugepages ("HugePages require cpu or
    # memory"), and that refusal shows up only in the controller log.
    requests:
      cpu: "16"
      memory: 128Gi
    limits:
      # 85 GB/rank of host pools + a 1 GiB segment per rank ~= 644 GiB; the
      # nodes advertise 660 GiB.
      hugepages-2Mi: 650Gi
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  progressDeadlineSeconds: 7200
  # Only nodes on the EBOF storage network can reach the NoF targets; the
  # GPU nodes without it are otherwise just as schedulable, and a pod placed
  # there starts, then fails every L3 transfer.
  nodeSelector:
    ebof.modelsphere.io/storage-net: "true"
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    - { key: ebof-test, operator: Exists, effect: NoSchedule }
    - { key: dedicated, operator: Exists, effect: NoSchedule }
