apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash-0731-nvfp4
id: sglang-tp8-6000d
version: 1.0.0
servedName: deepseek-v4-flash-0731-nvfp4
engine: sglang
description: >-
  NVIDIA's NVFP4 build with TP8 on one RTX 6000D node. Measured: ready in ~7 min on a cold cache, KV 6,274,304 tokens, deployed with this chart and answering correctly through the router; context 32768 as tested; thinking off by default. --moe-runner-backend=flashinfer_cutlass is required: by default sglang v0.5.20 picks flashinfer_trtllm_routed, which has no sm120 kernels, and dies in autotune. /root/.cache is a hostPath so compiled kernels survive a restart.
chart:
  name: sglang
  version: ">=0.9.14"
image:
  repository: lmsysorg/sglang
  tag: v0.5.20
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
    - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
    mountPath: /models
    hostPathType: Directory
    contextLength: "32768"
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tp-size=8
    - --mem-fraction-static=0.85
    - --moe-runner-backend=flashinfer_cutlass
    - --trust-remote-code
    - --enable-metrics
    - --enable-cache-report
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
  volumes:
    - name: engine-cache
      hostPath:
        path: /data/cache/deepseek-v4-flash-0731-nvfp4/sglang
        type: DirectoryOrCreate
  volumeMounts:
    - name: engine-cache
      mountPath: /root/.cache
  service:
    port: 8050
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  hangWatcher:
    enabled: true
