apiVersion: catalog.swiss/v1
name: deepseek-v4-flash-0731-nvfp4
version: 1.0.0
servedName: deepseek-v4-flash-0731-nvfp4
variants:
  - id: vllm-tp4-6000d
    description: >-
      NVIDIA's NVFP4 build (experts in NVFP4, attention and shared experts in FP8) with TP4 on four RTX 6000D GPUs, single node. Same flags as the deepseek-v4-flash vllm-tp4-6000d variant; not yet load-tested on this checkpoint.
    engine: vllm
    chart:
      name: vllm
      version: ">=0.7.6"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 4
      topology: single-node
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tensor-parallel-size=4
        - --gpu-memory-utilization=0.90
        - --block-size=256
        - --max-num-batched-tokens=8192
        - --max-num-seqs=48
        - --enable-prefix-caching
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=none.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=deepseek_v4
        - --reasoning-parser=deepseek_v4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: NCCL_DEBUG
          value: WARN
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      hangWatcher:
        enabled: true
  - id: vllm-tp8-6000d
    default: true
    description: >-
      NVIDIA's NVFP4 build with TP8 on one eight-GPU RTX 6000D node. Single node, so no RDMA and no host networking. Not yet load-tested on this checkpoint.
    engine: vllm
    chart:
      name: vllm
      version: ">=0.7.6"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tensor-parallel-size=8
        - --gpu-memory-utilization=0.90
        - --block-size=256
        - --max-num-batched-tokens=8192
        - --max-num-seqs=48
        - --enable-prefix-caching
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=none.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=deepseek_v4
        - --reasoning-parser=deepseek_v4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: NCCL_DEBUG
          value: WARN
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      hangWatcher:
        enabled: true
  - id: vllm-1p1d-6000d
    description: >-
      NVIDIA's NVFP4 build with prefill/decode disaggregation: one prefill and one decode pod, TP8 each on a whole RTX 6000D node, Mooncake transfer over RDMA, vllm-router in front. expandable_segments is off because Mooncake cannot register CUDA VMM memory (ibv_reg_mr fails with EFAULT). Not yet load-tested on this checkpoint.
    engine: vllm
    chart:
      name: vllm
      version: ">=0.8.7"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 8
      topology: pd
      rdma: true
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tensor-parallel-size=8
        - --gpu-memory-utilization=0.85
        - --block-size=256
        - --max-num-seqs=48
        - --enable-prefix-caching
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=none.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=deepseek_v4
        - --reasoning-parser=deepseek_v4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:False
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
          value: "8998"
        - name: NCCL_DEBUG
          value: WARN
      hostNetwork: true
      rdma:
        enabled: true
      shm:
        enabled: true
        sizeLimit: 8Gi
      pd:
        enabled: true
        colocate: false
        transferBackend: mooncake
        prefill:
          replicas: 1
          size: 1
          gpus: "8"
          httpPort: 8001
          extraArgs:
            - --max-num-batched-tokens=16384
        decode:
          replicas: 1
          size: 1
          gpus: "8"
          httpPort: 8002
          extraArgs:
            - --max-num-batched-tokens=16384
        router:
          replicas: 1
          policy: round_robin
      scaler:
        enabled: false
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      hangWatcher:
        enabled: true
