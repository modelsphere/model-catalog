  - id: vllm-1p1d-6000d
    description: >-
      NVIDIA's NVFP4 build, prefill/decode disaggregated: one prefill and one decode pod, TP8 each, Mooncake over RDMA, vllm-router in front; expandable_segments off so Mooncake can register GPU memory. Not yet run. FlashInfer autotune is off: with it on, vLLM v0.30.0 hangs on these cards at the whole-model autotune pass. /root/.cache is a hostPath so compiled kernels survive a restart.
    engine: vllm
    chart:
      name: vllm
      version: ">=0.8.7"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 8
      topology: pd
      rdma: true
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tensor-parallel-size=8
        - --gpu-memory-utilization=0.85
        - --no-enable-flashinfer-autotune
        - --block-size=256
        - --max-num-seqs=256
        - --enable-prefix-caching
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=none.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=deepseek_v4
        - --reasoning-parser=deepseek_v4
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:False
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
          value: "8998"
      hostNetwork: true
      rdma:
        enabled: true
      shm:
        enabled: true
        sizeLimit: 8Gi
      pd:
        enabled: true
        colocate: false
        transferBackend: mooncake
        prefill:
          replicas: 1
          size: 1
          gpus: "8"
          httpPort: 8001
          extraArgs:
            - --max-num-batched-tokens=16384
        decode:
          replicas: 1
          size: 1
          gpus: "8"
          httpPort: 8002
          extraArgs:
            - --max-num-batched-tokens=16384
        router:
          replicas: 1
          policy: round_robin
      scaler:
        enabled: false
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      hangWatcher:
        enabled: true
      volumes:
        - name: engine-cache
          hostPath:
            path: /data/cache/deepseek-v4-flash-0731-nvfp4/vllm
            type: DirectoryOrCreate
      volumeMounts:
        - name: engine-cache
          mountPath: /root/.cache
  - id: sglang-tp8-6000d
    description: >-
      NVIDIA's NVFP4 build with TP8 on one RTX 6000D node. Measured: ready in ~7 min on a cold cache, KV 6,274,304 tokens, deployed with this chart. --moe-runner-backend=marlin is required: the default trtllm backend has no sm120 kernels, and flashinfer_cutlass serves but silently miscomputes (identical temperature-0 requests answer 23*47 as 161, 1721, 1551); marlin was correct and stable. /root/.cache is a hostPath so compiled kernels survive a restart.
    engine: sglang
    chart:
      name: sglang
      version: ">=0.9.14"
    image:
      repository: lmsysorg/sglang
      tag: v0.5.20
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tp-size=8
        - --mem-fraction-static=0.85
        - --moe-runner-backend=marlin
        - --trust-remote-code
        - --max-running-requests=256
        - --enable-cache-report
        - '--default-chat-template-kwargs={"thinking": true}'
        - --reasoning-parser=deepseek-v4
        - --tool-call-parser=deepseekv4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: engine-cache
          hostPath:
            path: /data/cache/deepseek-v4-flash-0731-nvfp4/sglang
            type: DirectoryOrCreate
      volumeMounts:
        - name: engine-cache
