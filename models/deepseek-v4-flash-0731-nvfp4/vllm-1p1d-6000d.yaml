apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash-0731-nvfp4
id: vllm-1p1d-6000d
version: 1.0.2
servedName: deepseek-v4-flash-0731-nvfp4
description: >-
  NVIDIA's NVFP4 build, prefill/decode disaggregated: one prefill and one decode pod, TP8 each, Mooncake over RDMA, vllm-router in front; expandable_segments off so Mooncake can register GPU memory. Not yet run. FlashInfer autotune is off: with it on, vLLM v0.30.0 hangs on these cards at the whole-model autotune pass. /root/.cache is a hostPath so compiled kernels survive a restart.
engine: vllm
chart:
  name: vllm
  version: ">=0.8.7"
image:
  repository: vllm/vllm-openai
  tag: v0.30.0
requires:
  gpus: 8
  topology: pd
  rdma: true
  gpuProduct:
    - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
    mountPath: /models
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tensor-parallel-size=8
    - --gpu-memory-utilization=0.85
    - --no-enable-flashinfer-autotune
    - --block-size=256
    - --max-num-seqs=256
    - --enable-prefix-caching
    - --trust-remote-code
    - --enable-prompt-tokens-details
    - --allowed-media-domains=none.invalid
    - --enable-auto-tool-choice
    - --tool-call-parser=deepseek_v4
    - --reasoning-parser=deepseek_v4
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:False
    - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
      value: "0"
    - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
      value: "8998"
    - name: NCCL_DEBUG
      value: WARN
  hostNetwork: true
  rdma:
    enabled: true
  shm:
    enabled: true
    sizeLimit: 8Gi
  pd:
    enabled: true
    colocate: false
    transferBackend: mooncake
    prefill:
      replicas: 1
      size: 1
      gpus: "8"
      httpPort: 8001
      extraArgs:
        - --max-num-batched-tokens=16384
    decode:
      replicas: 1
      size: 1
      gpus: "8"
      httpPort: 8002
      extraArgs:
        - --max-num-batched-tokens=16384
    router:
      replicas: 1
      policy: round_robin
  scaler:
    enabled: false
  service:
    port: 8050
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  hangWatcher:
    enabled: true
  volumes:
    - name: engine-cache
      hostPath:
        path: /data/cache/deepseek-v4-flash-0731-nvfp4/vllm
        type: DirectoryOrCreate
  volumeMounts:
    - name: engine-cache
      mountPath: /root/.cache
