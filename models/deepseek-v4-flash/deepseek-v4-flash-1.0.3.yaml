apiVersion: catalog.swiss/v1
name: deepseek-v4-flash
version: 1.0.3
servedName: deepseek-v4-flash
variants:
- id: sglang-tp8-h100-baseline
  description: 'Baseline: TP8 on eight H100 GPUs, single node.'
  engine: sglang
  chart:
    name: sglang
    version: '>=0.7.1'
  image:
    repository: harbor.4pd.io/hardcore-tech/sglang
    tag: dev-dsv41
  requires:
    gpus: 8
    topology: single-node
    gpuProduct:
    - NVIDIA-H100-80GB-HBM3
  values:
    model:
      hostPathType: Directory
      contextLength: ''
    modelCheck:
      enabled: true
      requiredGlobs:
      - config.json
      - '*.safetensors'
    extraArgs:
    - --enable-cache-report
    - --moe-runner-backend=marlin
    - --stream-response-default-include-usage
    - --tp-size=8
    - --trust-remote-code
    env:
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: NVIDIA_DISABLE_REQUIRE
      value: '1'
    volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
    volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
    resources:
      requests:
        ephemeral-storage: 16Gi
      limits:
        ephemeral-storage: 16Gi
    progressDeadlineSeconds: 7200
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 180
    terminationGracePeriodSeconds: 3600
    lifecycle:
      preStop:
        drainSeconds: 600
        pollIntervalSeconds: 5
      forceShutdown: true
      preStopKill: true
    hangWatcher:
      enabled: true
- id: sglang-tp8-h100-optimized
  default: true
  description: 'Tuned by LLM AutoTune: TP8 on eight H100 GPUs, single node, EAGLE speculative decoding.
    +51% on the tuning benchmark vs the baseline variant.'
  engine: sglang
  chart:
    name: sglang
    version: '>=0.7.1'
  image:
    repository: harbor.4pd.io/hardcore-tech/sglang
    tag: dev-dsv41
  requires:
    gpus: 8
    topology: single-node
    gpuProduct:
    - NVIDIA-H100-80GB-HBM3
  values:
    model:
      hostPathType: Directory
      contextLength: ''
    modelCheck:
      enabled: true
      requiredGlobs:
      - config.json
      - '*.safetensors'
    extraArgs:
    - --enable-cache-report
    - --moe-runner-backend=marlin
    - --speculative-algorithm=EAGLE
    - --speculative-eagle-topk=1
    - --speculative-num-draft-tokens=4
    - --speculative-num-steps=3
    - --stream-response-default-include-usage
    - --tp-size=8
    - --trust-remote-code
    env:
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: NVIDIA_DISABLE_REQUIRE
      value: '1'
    volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
    volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
    resources:
      requests:
        ephemeral-storage: 16Gi
      limits:
        ephemeral-storage: 16Gi
    progressDeadlineSeconds: 7200
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 180
    terminationGracePeriodSeconds: 3600
    lifecycle:
      preStop:
        drainSeconds: 600
        pollIntervalSeconds: 5
      forceShutdown: true
      preStopKill: true
    hangWatcher:
      enabled: true
- id: vllm-tp8-6000d
  engine: vllm
  description: TP8 on one eight-GPU RTX 6000D node. Single-node, so no RDMA and no host networking.
  chart:
    name: vllm
    version: '>=0.7.6'
  image:
    repository: vllm/vllm-openai
    tag: v0.30.0
  requires:
    gpus: 8
    topology: single-node
    gpuProduct:
    - NVIDIA-RTX-6000D
  values:
    model:
      localPath: /data/models/DeepSeek-V4-Flash
      mountPath: /models
      contextLength: ''
    modelCheck:
      enabled: true
      requiredGlobs:
      - config.json
      - '*.safetensors'
    extraArgs:
    - --tensor-parallel-size=8
    - --gpu-memory-utilization=0.90
    - --block-size=256
    - --max-num-batched-tokens=8192
    - --max-num-seqs=48
    - --enable-prefix-caching
    - --trust-remote-code
    - --enable-prompt-tokens-details
    - --allowed-media-domains=none.invalid
    - --enable-auto-tool-choice
    - --tool-call-parser=deepseek_v4
    - --reasoning-parser=deepseek_v4
    env:
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: NCCL_DEBUG
      value: WARN
    service:
      port: 8050
    hangWatcher:
      enabled: true
- id: sglang-tp8-6000d
  engine: sglang
  description: TP8 on one eight-GPU node, default MoE runner. Measured max_total_num_tokens 6,524,672.
  chart:
    name: sglang
    version: '>=0.7.0'
  image:
    repository: lmsysorg/sglang
    tag: v0.5.20
  requires:
    gpus: 8
    topology: single-node
    gpuProduct:
    - NVIDIA-RTX-6000D
  values:
    model:
      localPath: /data/models/DeepSeek-V4-Flash
      mountPath: /model
      contextLength: ''
    modelCheck:
      enabled: true
      requiredGlobs:
      - config.json
      - '*.safetensors'
    extraArgs:
    - --tp-size=8
    - --mem-fraction-static=0.85
    - --trust-remote-code
    - --enable-metrics
    - --enable-cache-report
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
    env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: '1'
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    service:
      port: 8050
    hangWatcher:
      enabled: true
- id: sglang-tp4-6000d
  engine: sglang
  description: 'TP4 on four GPUs. 149 GiB of weights do not need eight cards: halving them still leaves
    61% of the KV pool, because the weights are a fixed cost that does not shrink with the card count.
    Measured 38.57 GiB of weights per card and max_total_num_tokens 4,002,048, against 6,524,672 at TP8.
    Those two numbers imply ~34 and ~68 KiB per token respectively, so neither can be used to extrapolate
    another TP width -- the reason for the gap is not known.'
  chart:
    name: sglang
    version: '>=0.7.0'
  image:
    repository: lmsysorg/sglang
    tag: v0.5.20
  requires:
    gpus: 4
    topology: single-node
    gpuProduct:
    - NVIDIA-RTX-6000D
  values:
    model:
      localPath: /data/models/DeepSeek-V4-Flash
      mountPath: /model
      contextLength: ''
    modelCheck:
      enabled: true
      requiredGlobs:
      - config.json
      - '*.safetensors'
    extraArgs:
    - --tp-size=4
    - --mem-fraction-static=0.85
    - --trust-remote-code
    - --enable-metrics
    - --enable-cache-report
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
    env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: '1'
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    service:
      port: 8050
    hangWatcher:
      enabled: true
- id: vllm-tp4-6000d
  engine: vllm
  description: TP4 on four GPUs, the vLLM counterpart of sglang-tp4-6000d. Measured 39.42 GiB per card
    for weights plus non-torch memory, 33.07 GiB left for KV, GPU KV cache size 3,447,225 tokens -- 3.29x
    the 1,048,576-token maximum request length. The engine's own suggestion is to raise the KV allocation
    to 40.08 GiB with --kv-cache-memory, which is left off here because it has not been load-tested.
  chart:
    name: vllm
    version: '>=0.7.6'
  image:
    repository: vllm/vllm-openai
    tag: v0.30.0
  requires:
    gpus: 4
    topology: single-node
    gpuProduct:
    - NVIDIA-RTX-6000D
  values:
    model:
      localPath: /data/models/DeepSeek-V4-Flash
      mountPath: /models
      contextLength: ''
    modelCheck:
      enabled: true
      requiredGlobs:
      - config.json
      - '*.safetensors'
    extraArgs:
    - --tensor-parallel-size=4
    - --gpu-memory-utilization=0.90
    - --block-size=256
    - --max-num-batched-tokens=8192
    - --max-num-seqs=48
    - --enable-prefix-caching
    - --trust-remote-code
    - --enable-prompt-tokens-details
    - --allowed-media-domains=none.invalid
    - --enable-auto-tool-choice
    - --tool-call-parser=deepseek_v4
    - --reasoning-parser=deepseek_v4
    env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: '1'
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
    - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
      value: '0'
    - name: NCCL_DEBUG
      value: WARN
    service:
      port: 8050
    hangWatcher:
      enabled: true
- id: sglang-1p1d-h100
  description: 'DeepSeek-V4-Flash with prefill/decode disaggregation: 1 prefill + 1 decode pod (TP8 each)
    on H100, Mooncake transfer backend, cache-aware router.'
  engine: sglang
  chart:
    name: sglang
    version: 0.9.2
  image:
    repository: lmsysorg/sglang
    tag: v0.5.20
  requires:
    gpus: 8
    topology: single-node
    rdma: true
    gpuProduct:
    - NVIDIA-H100-80GB-HBM3
  values:
    model:
      localPath: /data/models/DeepSeek-V4-Flash
      mountPath: /model
      hostPathType: Directory
      contextLength: ''
    modelCheck:
      enabled: true
      requiredGlobs:
      - config.json
      - '*.safetensors'
    extraArgs:
    - --tp-size=8
    - --mem-fraction-static=0.85
    - --trust-remote-code
    - --enable-metrics
    - --enable-cache-report
    - --reasoning-parser=deepseek-v4
    - --tool-call-parser=deepseekv4
    - --dist-timeout=1800
    env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: '1'
    - name: NCCL_DEBUG
      value: WARN
    pd:
      enabled: true
      prefill:
        gpus: '8'
        extraArgs:
        - --chunked-prefill-size=16384
        - --max-prefill-tokens=16384
        - --max-running-requests=64
      decode:
        gpus: '8'
        extraArgs:
        - --cuda-graph-max-bs-decode=32
        - --max-running-requests=64
    rdma:
      enabled: true
    scaler:
      enabled: false
    hostNetwork: true
    shm:
      sizeLimit: 32Gi
    volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    resources:
      requests:
        ephemeral-storage: 16Gi
      limits:
        ephemeral-storage: 16Gi
