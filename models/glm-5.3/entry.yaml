apiVersion: catalog.swiss/v1
name: glm-5.3
displayName: GLM 5.3
family: glm
license: MIT
tags: [chat, reasoning, tool-use]
description: >-
  Reasoning and tool-use model. Served with SGLang's glm45 reasoning parser and
  glm47 tool-call parser, which are what make the <think> blocks and tool calls
  come back as structured fields rather than as raw text in the content.

source:
  hf: zai-org/GLM-5.3
  sizeGiB: 700
  # The default ([config.json]) is enough for most models. Spelled out here
  # because a half-synced weights directory is the failure this catches, and on
  # a 700 GiB model that sync is long enough to be caught mid-flight.
  requiredGlobs:
    - config.json
    - "*.safetensors"

variants:
  # -------------------------------------------------------------------------
  # The only variant today. TP8 across one B300 node -- the model does not fit
  # in fewer, and a second node would have to cross the fabric for no gain.
  # -------------------------------------------------------------------------
  - id: sglang-tp8-b300
    default: true
    engine: sglang
    description: TP8 on a single 8-GPU B300 node.
    chart: { name: sglang, version: "0.8.0" }
    image:
      repository: lmsysorg/sglang
      tag: v0.5.19
    requires:
      gpus: 8
      topology: single-node
      gpuProduct: [NVIDIA-B300-SXM6-AC]
    values:
      model:
        mountPath: /model
        # Directory, not DirectoryOrCreate: the kubelet then refuses the pod when
        # the path is missing, instead of mounting an empty directory and letting
        # the engine fail minutes later with an error that points at the model.
        hostPathType: Directory
      extraArgs:
        - --trust-remote-code
        - --tp-size=8
        - --max-running-requests=128
        - --chunked-prefill-size=32768
        - --mem-fraction-static=0.85
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --reasoning-parser=glm45
        - --tool-call-parser=glm47
        - --tokenizer-worker-num=4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: TORCHINDUCTOR_COMPILE_THREADS
          value: "8"
      # Both are per-pod scratch, deliberately not hostPath: several replicas can
      # land on one node once the scaler is on, and a compile cache shared by
      # concurrent pods corrupts. Host-level cache sharing is cache.* in the
      # chart, which the site profile owns.
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      # 700 GiB off local disk, plus kernel compilation on a cold node.
      # 80 x 15s = 20 minutes before the pod is declared failed.
      startupProbe:
        periodSeconds: 15
        failureThreshold: 80
