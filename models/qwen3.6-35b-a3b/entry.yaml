apiVersion: catalog.swiss/v1
name: qwen3.6-35b-a3b
servedName: kimi
displayName: Qwen3.6-35B-A3B
family: qwen
tags: [chat, moe, fallback]
description: >-
  Qwen3.6-35B-A3B-793303 on two GPUs. Deployed as the fallback tier and served
  under the name "kimi", so callers do not change when they land on it.

source:
  hf: modelforge/Qwen3.6-35B-A3B-793303
  requiredGlobs:
    - config.json
    - "*.safetensors"

variants:
  - id: sglang-tp2
    default: true
    engine: sglang
    description: TP2 on two GPUs, single node.
    chart: { name: sglang, version: "0.7.0" }
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: v0.5.15-cu129
    requires:
      gpus: 2
      topology: single-node
    values:
      model:
        hostPathType: Directory
        # Never pinned: a number here would silently cap a 35B model.
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs: [config.json, "*.safetensors"]
      extraArgs:
        - --tp-size=2
        - --mamba-radix-cache-strategy=extra_buffer
        - --chunked-prefill-size=16384
        - --mem-fraction-static=0.83
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --reasoning-parser=qwen3
        - --tool-call-parser=qwen3_coder
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 80
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          enabled: true
          endpointSyncSeconds: 5
          drainSeconds: 600
          pollIntervalSeconds: 5
        shutdownReserveSeconds: 20
        forceShutdown: true
