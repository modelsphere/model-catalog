# Variant distilled from a preserved modelforge build
# (/mnt/disk0/models/modelforge/preserved-2900), served as "qwen-distilled-k3".
# metadata.yaml's source.hf names the upstream Qwen weights, so model.localPath
# is set explicitly instead of being derived from source.hf.
# Mirrored from the docker run deploy (sglang v0.5.15-cu129, port 8050).
apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3.6-35b-a3b
id: sglang-tp2-a100-distilled-1m
version: 1.0.0
servedName: qwen-distilled-k3
description: >-
  TP2 on two A100 GPUs, single node, distilled 1M-context modelforge
  build, mamba extra_buffer cache strategy.
engine: sglang
chart:
  name: sglang
  version: ">=0.7.1"
image:
  repository: harbor.4pd.io/hardcore-tech/sglang
  tag: v0.5.15-cu129
requires:
  gpus: 2
  topology: single-node
  gpuProduct:
    - NVIDIA-A100-SXM4-80GB
values:
  model:
    localPath: /mnt/disk0/models/modelforge/preserved-2900
    mountPath: /model
    hostPathType: Directory
    contextLength: ""
  modelCheck:
    enabled: true
    requiredGlobs:
      - config.json
      - "*.safetensors"
  extraArgs:
    - --tp-size=2
    - --mamba-radix-cache-strategy=extra_buffer
    - --chunked-prefill-size=16384
    - --mem-fraction-static=0.83
    - --enable-cache-report
    - --enable-metrics
    - --stream-response-default-include-usage
    - --reasoning-parser=qwen3
    - --tool-call-parser=qwen3_coder
  env:
    - name: NVIDIA_DISABLE_REQUIRE
      value: "1"
    - name: PYTORCH_ALLOC_CONF
      value: expandable_segments:True
  volumes:
    - name: dot-cache
      emptyDir:
        sizeLimit: 10Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  volumeMounts:
    - name: dot-cache
      mountPath: /root/.cache
    - name: dshm
      mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  service:
    port: 8050
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
