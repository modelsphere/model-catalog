# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v1
name: ling-3.0-flash
version: 1.0.0
servedName: Ling-3.0-flash
variants:
  - id: sglang-tp8-h100-baseline
    description: 'Baseline: TP8 on eight H100 GPUs, single node.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.1"
    image:
      repository: lmsysorg/sglang
      tag: dev-Ling-3.0-flash-VL
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --chat-template=/model/chat_template.jinja
        - --enable-cache-report
        - --mem-fraction-static=0.8
        - --reasoning-parser=ling3
        - --stream-response-default-include-usage
        - --tool-call-parser=ling3
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
  - id: sglang-tp8-h100-optimized
    default: true
    description: 'Tuned by LLM AutoTune: TP8 on eight H100 GPUs, single node. Normalized throughput within the SLO vs the baseline variant: +15.5% (50k + 1.5k), +21.3% (8k + 1k).'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.1"
    image:
      repository: lmsysorg/sglang
      tag: dev-Ling-3.0-flash-VL
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        mountPath: /model
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --chat-template=/model/chat_template.jinja
        - --chunked-prefill-size=16384
        - --enable-cache-report
        - --max-prefill-tokens=32768
        - --mem-fraction-static=0.8
        - --reasoning-parser=ling3
        - --stream-response-default-include-usage
        - --tool-call-parser=ling3
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
