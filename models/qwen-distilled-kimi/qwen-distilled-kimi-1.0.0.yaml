apiVersion: catalog.swiss/v1
name: qwen-distilled-kimi
version: 1.0.0
servedName: qwen-distilled-kimi
variants:
  # gpus 4 with --tp-size=2 is what release/modelforge_03_kimi-nvidia_a100-sglang
  # deploys, transcribed rather than corrected: the pod really does request four
  # A100s and the engine really does start on two. It runs, with two cards idle,
  # and 4 is the number preflight has to check, so 4 is the number here.
  # Publish 1.1.0 with gpus 2, or with --tp-size=4, once the branch settles it.
  - id: sglang-tp2-a100
    default: true
    engine: sglang
    description: TP2 on an A100 node, four GPUs requested.
    chart:
      name: sglang
      version: 0.7.0
    image:
      repository: harbor.4pd.io/hardcore-tech/sglang
      tag: v0.5.15-cu129
    requires:
      gpus: 4
      topology: single-node
      gpuProduct:
        - NVIDIA-A100-SXM4-80GB
    values:
      model:
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      # Everything here is appended to the sglang serve command, so it has to be
      # an argument that command accepts. Container flags (--ulimit, --shm-size)
      # make the container exit on startup; locked memory is the chart
      # securityContext (capabilities: IPC_LOCK), not an extra arg.
      extraArgs:
        - --tp-size=2
        - --mamba-radix-cache-strategy=extra_buffer
        - --chunked-prefill-size=16384
        - --mem-fraction-static=0.83
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --reasoning-parser=qwen3
        - --tool-call-parser=qwen3_coder
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 80
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          enabled: true
          endpointSyncSeconds: 5
          drainSeconds: 600
          pollIntervalSeconds: 5
        shutdownReserveSeconds: 20
        forceShutdown: true
