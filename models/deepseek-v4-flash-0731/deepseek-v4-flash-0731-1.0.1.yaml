# Serving configs measured, and where marked tuned, by LLM AutoTune.
apiVersion: catalog.swiss/v1
name: deepseek-v4-flash-0731
version: 1.0.1
servedName: DeepSeek-V4-Flash-0731
variants:
  - id: sglang-tp8-h100-baseline
    description: 'Baseline: TP8 on eight H100 GPUs, single node.'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.1"
    image:
      repository: lmsysorg/sglang
      tag: v0.5.19-cu129
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --enable-cache-report
        - --moe-runner-backend=marlin
        - --stream-response-default-include-usage
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
  - id: sglang-tp8-h100-optimized
    default: true
    description: 'Tuned by LLM AutoTune: TP8 on eight H100 GPUs, single node, DSPARK speculative decoding. Normalized throughput within the SLO vs the baseline variant: +58.0% (50k + 1.5k), +23.4% (8k + 1k).'
    engine: sglang
    chart:
      name: sglang
      version: ">=0.7.1"
    image:
      repository: lmsysorg/sglang
      tag: v0.5.19-cu129
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-H100-80GB-HBM3
    values:
      model:
        hostPathType: Directory
        contextLength: ''
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - '*.safetensors'
      extraArgs:
        - --enable-cache-report
        - --moe-runner-backend=marlin
        - --speculative-algorithm=DSPARK
        - --stream-response-default-include-usage
        - --tp-size=8
        - --trust-remote-code
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: '1'
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      volumes:
        - name: dot-cache
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      volumeMounts:
        - name: dot-cache
          mountPath: /root/.cache
        - name: dshm
          mountPath: /dev/shm
      resources:
        requests:
          ephemeral-storage: 16Gi
        limits:
          ephemeral-storage: 16Gi
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      terminationGracePeriodSeconds: 3600
      lifecycle:
        preStop:
          drainSeconds: 600
          pollIntervalSeconds: 5
        forceShutdown: true
        preStopKill: true
      hangWatcher:
        enabled: true
  - id: vllm-tp4-6000d
    description: >-
      NVIDIA's NVFP4 build (experts in NVFP4, attention and shared experts in FP8) with TP4 on four RTX 6000D GPUs, single node. Same flags as the deepseek-v4-flash vllm-tp4-6000d variant; not yet load-tested on this checkpoint.
    engine: vllm
    chart:
      name: vllm
      version: ">=0.7.6"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 4
      topology: single-node
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tensor-parallel-size=4
        - --gpu-memory-utilization=0.90
        - --block-size=256
        - --max-num-batched-tokens=8192
        - --max-num-seqs=48
        - --enable-prefix-caching
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=none.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=deepseek_v4
        - --reasoning-parser=deepseek_v4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: NCCL_DEBUG
          value: WARN
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      hangWatcher:
        enabled: true
  - id: vllm-tp8-6000d
    description: >-
      NVIDIA's NVFP4 build with TP8 on one eight-GPU RTX 6000D node. Single node, so no RDMA and no host networking. Not yet load-tested on this checkpoint.
    engine: vllm
    chart:
      name: vllm
      version: ">=0.7.6"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 8
      topology: single-node
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tensor-parallel-size=8
        - --gpu-memory-utilization=0.90
        - --block-size=256
        - --max-num-batched-tokens=8192
        - --max-num-seqs=48
        - --enable-prefix-caching
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=none.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=deepseek_v4
        - --reasoning-parser=deepseek_v4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: NCCL_DEBUG
          value: WARN
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      hangWatcher:
        enabled: true
  - id: vllm-1p1d-6000d
    description: >-
      NVIDIA's NVFP4 build with prefill/decode disaggregation: one prefill and one decode pod, TP8 each on a whole RTX 6000D node, Mooncake transfer over RDMA, vllm-router in front. expandable_segments is off because Mooncake cannot register CUDA VMM memory (ibv_reg_mr fails with EFAULT). Not yet load-tested on this checkpoint.
    engine: vllm
    chart:
      name: vllm
      version: ">=0.8.7"
    image:
      repository: vllm/vllm-openai
      tag: v0.30.0
    requires:
      gpus: 8
      topology: pd
      rdma: true
      gpuProduct:
        - NVIDIA-RTX-6000D
    values:
      model:
        localPath: /data/models/DeepSeek-V4-Flash-0731-NVFP4
        mountPath: /models
        hostPathType: Directory
        contextLength: ""
      modelCheck:
        enabled: true
        requiredGlobs:
          - config.json
          - "*.safetensors"
      extraArgs:
        - --tensor-parallel-size=8
        - --gpu-memory-utilization=0.85
        - --block-size=256
        - --max-num-seqs=48
        - --enable-prefix-caching
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --allowed-media-domains=none.invalid
        - --enable-auto-tool-choice
        - --tool-call-parser=deepseek_v4
        - --reasoning-parser=deepseek_v4
      env:
        - name: NVIDIA_DISABLE_REQUIRE
          value: "1"
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:False
        - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
          value: "0"
        - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
          value: "8998"
        - name: NCCL_DEBUG
          value: WARN
      hostNetwork: true
      rdma:
        enabled: true
      shm:
        enabled: true
        sizeLimit: 8Gi
      pd:
        enabled: true
        colocate: false
        transferBackend: mooncake
        prefill:
          replicas: 1
          size: 1
          gpus: "8"
          httpPort: 8001
          extraArgs:
            - --max-num-batched-tokens=16384
        decode:
          replicas: 1
          size: 1
          gpus: "8"
          httpPort: 8002
          extraArgs:
            - --max-num-batched-tokens=16384
        router:
          replicas: 1
          policy: round_robin
      scaler:
        enabled: false
      service:
        port: 8050
      progressDeadlineSeconds: 7200
      startupProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 180
      hangWatcher:
        enabled: true
